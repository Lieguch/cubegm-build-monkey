main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"; exit 0
            fi
            mkdir -p /tmp/arm-pkgs /tmp/arm-root
            cd /tmp/arm-pkgs
            BASE=http://archive.debian.org/debian/pool/main
            wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
            wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
            for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
            find /tmp/arm-root -name "libc.so" -path "*arm-linux*"
            mkdir -p /arm-root
            cp -a /tmp/arm-root/. /arm-root/
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"
            cd rkgame-rebuild
            bash build.sh output/rkgame
            ls -la output/rkgame
            echo "BUILD DONE"

        - name: pack-and-upload
          script: |
            set -e
            echo "API_ENDPOINT=${CNB_API_ENDPOINT:-not-set}"
            echo "REPO_SLUG=${CNB_REPO_SLUG:-not-set}"
            echo "COMMIT=${CNB_COMMIT:-not-set}"
            echo "TOKEN set: yes"
            [ -n "$CNB_TOKEN" ] || { echo "ERROR: CNB_TOKEN not set"; exit 1; }
            cd rkgame-rebuild
            BINARY="output/rkgame"
            if [ ! -f "$BINARY" ]; then
              echo "ERROR: $BINARY not found"; exit 1
            fi
            tar -czf dist.tar.gz "$BINARY"
            FILE_SIZE=$(stat -c%s dist.tar.gz)
            echo "dist.tar.gz size=$FILE_SIZE"
            UPLOAD_URL=$(curl -sS -X POST \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "{\"asset_name\":\"dist.tar.gz\",\"size\":$FILE_SIZE}" \
              "${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/git/commit-assets/${CNB_COMMIT}/asset-upload-url")
            echo "GET_UPLOAD_URL_RESP: $UPLOAD_URL"
            SIGNED_URL=$(echo "$UPLOAD_URL" | grep -o '"upload_url"[^,]*' | cut -d'"' -f4)
            VERIFY_URL=$(echo "$UPLOAD_URL" | grep -o '"verify_url"[^,]*' | cut -d'"' -f4)
            echo "SIGNED_URL=*** $SIGNED_URL"
            echo "VERIFY_URL=*** $VERIFY_URL"
            [ -n "$SIGNED_URL" ] || { echo "Failed to parse upload_url"; exit 1; }
            [ -n "$VERIFY_URL" ] || { echo "Failed to parse verify_url"; exit 1; }
            curl -sS -X PUT -T dist.tar.gz "$SIGNED_URL"
            echo "PUT OK"
            curl -sS -X POST -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Accept: application/vnd.cnb.api+json" "$VERIFY_URL"
            echo "VERIFY OK"
            echo "DOWNLOAD_URL: ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/commit-assets/download/${CNB_COMMIT}/dist.tar.gz"
            echo "UPLOAD DONE"

