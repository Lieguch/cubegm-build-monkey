main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"; exit 0
            fi
            mkdir -p /tmp/arm-pkgs /tmp/arm-root
            cd /tmp/arm-pkgs
            BASE=http://archive.debian.org/debian/pool/main
            wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
            wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
            for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
            find /tmp/arm-root -name "libc.so" -path "*arm-linux*"
            mkdir -p /arm-root
            cp -a /tmp/arm-root/. /arm-root/
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"
            cd rkgame-rebuild
            bash build.sh output/rkgame

        - name: abi-check
          script: |
            set -e
            OUT=rkgame-rebuild/output/rkgame
            file "$OUT"
            python3 -c "
import struct
with open('rkgame-rebuild/output/rkgame', 'rb') as f:
    data = f.read()
flags = struct.unpack('<I', data[20:24])[0]
print(f'FLAGS=0x{flags:08x}')
fp_abi = (flags >> 9) & 0x3
print(f'FP_ABI={fp_abi} (2=hard, 0=soft, 1=vfp)')
assert fp_abi == 2, f'Not hard-float ABI! Got {fp_abi}'
"
            arm-linux-gnueabihf-objdump -T "$OUT" | head -50
            if arm-linux-gnueabihf-objdump -T "$OUT" | grep -qE "GLIBC_2\.(3[4-9]|4[0-9]|5[0-9])"; then
              echo "FATAL: GLIBC_2.34+"; exit 1
            fi
            echo "ABI PASSED"

