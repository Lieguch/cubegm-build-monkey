# =============================================================================
# 云原生开发（远程开发）—— 开发环境声明
# -----------------------------------------------------------------------------
# ★ 根因（2026-09-29，官方文档核实：docs.cnb.cool/zh/workspaces/workspace-recycling.html
#   + docs.cnb.build/zh/workspaces/only-preview.html）：
#   工作区被回收的**唯一**触发条件是「检测不到 HTTP/SSH 心跳持续超过 keepAliveTimeout」，
#   默认 600000 ms = **10 分钟**；平台**最大保持 18 小时**（持续心跳可维持）。
#   ⇒ 旧记忆里的"约 15 分钟自动关闭 / 容器周期性重启"是**对默认离线保活的误判**，
#     不是平台硬上限，也不是"配额"。
#   ⇒ 对策：显式把 keepAliveTimeout 抬到平台上限 18h，让 20+ 分钟的重建/实验一次跑完。
#   ★ 与 main: 构建流水线的"CPU 核时配额不足"是**两回事**：云原生开发独立额度（1600 核时/月），
#     云原生构建只有 160 核时/月 —— 这解释了"构建卡 Prepare、云开发照样能开"。
#
# 回退：删掉下面整段 `$:` 配置即可（工作区回到平台默认环境 + 默认 10 分钟保活）。
# =============================================================================
$: # 兜底匹配所有分支
  vscode:
    - runner:
        cpus: 8 # 8 核 / 16 GB（核时 = 8 × 小时；云原生开发免费额度 1600 核时/月）
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - name: vscode
          options:
            keepAliveTimeout: 18h # ← 根因修复：默认仅 10 分钟无心跳即回收
        - docker
      stages:
        # 环境就绪即自证重建所需的 Python 依赖，避免每次会话重复装
        - name: deps-selftest
          script: |
            set -u
            python3 -m pip install -q --break-system-packages pyelftools capstone unicorn ziglang 2>/dev/null \
              || python3 -m pip install -q pyelftools capstone unicorn ziglang 2>/dev/null \
              || echo "(pip 安装失败，进入环境后手动装)"
            python3 -c "import elftools,capstone,unicorn;print('elftools/capstone/unicorn OK')" || true
            python3 -c "import ziglang,os;print('zig =',os.path.join(os.path.dirname(ziglang.__file__),'zig'))" || true

main:
# ★★★ 2026-10-01（第 106 轮）：**已移除 push 触发的构建流水线**
#   （原文是 `main: push: rkgame-rebuild`，共 370 行）。
#   依据 = 用户既定口径（PROJECT-MEMORY §0.23 纪律 54）：「CNB 代码托管 + CNB 云开发 + **GitHub 构建 CI**」，
#   并明文写着「**CNB 不是构建通道**」。
#   实测后果：`main: push:` 让**每次 git push 都在 CNB 再跑一遍完整构建**，与 GitHub Actions 的构建重复，
#   且消耗 CNB **云原生构建**额度（**160 核时/月**；与云开发的 1600 核时是**独立**额度，见 §0.25-A）。
#   保留：`$:`（vscode 云开发 —— 用户口径的正路）与 `api_trigger_build:`（**手动**按需触发，不自动跑）。
#   回退：原文备份在 `build/_exp/.cnb.yml.pre-nopush`，粘回即可恢复 push 触发。
#
  api_trigger_build:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates

            # Two-phase setup: base glibc package OR individual DRM add-on.
            # Prior to 2026-09-05, libdrm was bundled in the glibc-only
            # download block, so when /arm-root cached libc.so but the
            # libdrm .debs had never been fetched (because the block was
            # skipped on cache), libdrm.so/xf86drm.h ended up missing.
            BASE=http://archive.debian.org/debian/pool/main
            mkdir -p /arm-root
            LIBDRM_OK=0
            if [ -f /arm-root/usr/include/xf86drm.h ] || [ -f /arm-root/usr/include/libdrm/xf86drm.h ]; then
              if [ -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so ] || [ -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so.2 ]; then
                LIBDRM_OK=1
                echo "libdrm already present, skipping DRM add-on"
              fi
            fi

            if [ ! -f /arm-root/usr/lib/arm-linux-gnueabihf/libc.so ]; then
              mkdir -p /tmp/arm-pkgs /tmp/arm-root
              cd /tmp/arm-pkgs
              echo "  downloading glibc packages..."
              wget -q --progress=dot:mega --timeout=60 "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
              wget -q --progress=dot:mega --timeout=60 "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
              wget -q --progress=dot:mega --timeout=60 "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
              wget -q --progress=dot:mega --timeout=60 "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
              wget -q --progress=dot:mega --timeout=60 "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
              if [ $LIBDRM_OK -eq 0 ]; then
                echo "  downloading linux-libc-dev..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/l/linux/linux-libc-dev_4.9.228-1_armhf.deb"
                echo "  downloading libdrm2..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/libd/libdrm/libdrm2_2.4.97-1_armhf.deb"
                echo "  downloading libdrm-dev..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/libd/libdrm/libdrm-dev_2.4.97-1_armhf.deb"
              fi
              for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
              cp -a /tmp/arm-root/. /arm-root/
              echo "SYSROOT packages downloaded (base + $([ $LIBDRM_OK -eq 0 ] && echo 'drm' || echo 'none'))"
            else
              echo "SYSROOT base cached"
              if [ $LIBDRM_OK -eq 0 ]; then
                mkdir -p /tmp/arm-pkgs-drm /tmp/arm-root-drm
                cd /tmp/arm-pkgs-drm
                echo "  downloading linux-libc-dev (add-on)..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/l/linux/linux-libc-dev_4.9.228-1_armhf.deb"
                echo "  downloading libdrm2 (add-on)..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/libd/libdrm/libdrm2_2.4.97-1_armhf.deb"
                echo "  downloading libdrm-dev (add-on)..."
                wget -q --progress=dot:mega --timeout=60 "$BASE/libd/libdrm/libdrm-dev_2.4.97-1_armhf.deb"
                for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root-drm/; done
                cp -a /tmp/arm-root-drm/. /arm-root/
                echo "DRM add-on packages added to sysroot"
              fi
            fi

            # Post-extract normalization: Debian 9 libdrm-dev puts xf86drm.h
            # under /usr/include/libdrm/ and only ships libdrm.so.2 (no
            # unversioned .so symlink). Linker + preprocessor need the
            # conventional paths.
            if [ -f /arm-root/usr/include/libdrm/xf86drm.h ] && [ ! -f /arm-root/usr/include/xf86drm.h ]; then
              ln -sf libdrm/xf86drm.h /arm-root/usr/include/xf86drm.h
              ln -sf libdrm/xf86drmMode.h /arm-root/usr/include/xf86drmMode.h
              echo "  Created xf86drm.h + xf86drmMode.h symlinks from libdrm/"
            fi
            if [ ! -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so ] && [ -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so.2 ]; then
              ln -sf libdrm.so.2 /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so
              echo "  Created libdrm.so symlink -> libdrm.so.2"
            fi
            # xf86drm.h + xf86drmMode.h include <drm.h>, <drm_mode.h>,
            # <drm_fourcc.h>, etc. libdrm-dev ships all of them under
            # /usr/include/libdrm/. Rather than picking one-off symlinks,
            # bulk-link every top-level .h in libdrm/ up to /usr/include/.
            # This lets '#include <drm.h>' and friends resolve without
            # touching -I flags.
            if [ -d /arm-root/usr/include/libdrm ]; then
              for f in /arm-root/usr/include/libdrm/*.h; do
                base=$(basename "$f")
                if [ ! -f "/arm-root/usr/include/$base" ]; then
                  ln -sf "libdrm/$base" "/arm-root/usr/include/$base"
                fi
              done
              echo "  Bulk-linked libdrm/*.h -> /usr/include/*.h"
            fi

            # ALWAYS fix broken absolute symlinks (not just on first setup).
            # Debian 9 packages ship libdl.so/libm.so/libpthread.so as
            # symlinks to absolute paths like /lib/arm-linux-gnueabihf/*.so.2.
            # These don't exist on CNB host. Replace with RELATIVE symlinks
            # so the linker can resolve them within the sysroot.
            # Also fix libc.so linker script: replace absolute paths with
            # relative (same-dir) paths so --sysroot is not needed.
            LIBDIR=/arm-root/usr/lib/arm-linux-gnueabihf
            RUNDIR=/arm-root/lib/arm-linux-gnueabihf

            # libdl.so -> ../../../lib/arm-linux-gnueabihf/libdl.so.2
            ln -sf ../../../lib/arm-linux-gnueabihf/libdl.so.2 "$LIBDIR/libdl.so"
            # libm.so -> ../../../lib/arm-linux-gnueabihf/libm.so.6
            ln -sf ../../../lib/arm-linux-gnueabihf/libm.so.6 "$LIBDIR/libm.so"
            # libpthread.so -> ../../../lib/arm-linux-gnueabihf/libpthread.so.0
            ln -sf ../../../lib/arm-linux-gnueabihf/libpthread.so.0 "$LIBDIR/libpthread.so"

            # libc.so is a linker script. The script is in /usr/lib/...
            # but libc.so.6 is in /lib/... and libc_nonshared.a is in /usr/lib/...
            # Use relative paths: ../../../lib/... for libc.so.6, same-dir for libc_nonshared.a
            printf '/* GNU ld script\n   Use libc.so.6 and libc_nonshared.a if available\n   */\nGROUP ( AS_NEEDED ( ../../../lib/arm-linux-gnueabihf/libc.so.6 libc_nonshared.a ) )\n' > "$LIBDIR/libc.so"
            echo "Fixed libc.so linker script (relative paths)"

            # The device's dynamic linker is at /lib/ld-linux-armhf.so.3
            # (NOT /lib/arm-linux-gnueabihf/ld-linux-armhf.so.3).
            # Our --dynamic-linker flag must match the device's path.
            # Ensure the sysroot has the linker at /arm-root/lib/ld-linux-armhf.so.3
            if [ -f "$RUNDIR/ld-linux-armhf.so.3" ] && [ ! -f /arm-root/lib/ld-linux-armhf.so.3 ]; then
              ln -sf arm-linux-gnueabihf/ld-linux-armhf.so.3 /arm-root/lib/ld-linux-armhf.so.3
              echo "Created symlink: /arm-root/lib/ld-linux-armhf.so.3"
            elif [ -f /arm-root/lib/ld-linux-armhf.so.3 ]; then
              echo "Dynamic linker already at /arm-root/lib/ld-linux-armhf.so.3"
            else
              echo "WARNING: ld-linux-armhf.so.3 not found in either location"
            fi

            # Verify all fixed symlinks resolve
            echo "Verifying symlinks..."
            for f in libdl.so libm.so libpthread.so; do
              target=$(readlink -f "$LIBDIR/$f")
              echo "  $f -> $target"
              if [ ! -f "$target" ]; then
                echo "FATAL: $f target not found: $target"
                exit 1
              fi
            done
            echo "SYSROOT ready"

            # Always-on DRM diagnostic (survives volume caching)
            echo "--- DRM presence check (always) ---"
            echo "  libdrm files under /arm-root/usr/lib:"
            find /arm-root/usr/lib -name 'libdrm*' 2>/dev/null | head -20
            echo "  xf86drm headers:"
            find /arm-root/usr/include -name 'xf86drm*.h' 2>/dev/null
            echo "  Expected /arm-root/usr/include/xf86drm.h:"
            ls -la /arm-root/usr/include/xf86drm.h 2>&1
            # If xf86drm.h lives under libdrm/ subdir, symlink it
            if [ ! -f /arm-root/usr/include/xf86drm.h ] && [ -f /arm-root/usr/include/libdrm/xf86drm.h ]; then
              ln -sf libdrm/xf86drm.h /arm-root/usr/include/xf86drm.h
              ln -sf libdrm/xf86drmMode.h /arm-root/usr/include/xf86drmMode.h
              echo "  Created xf86drm.h symlinks (was under libdrm/)"
            fi
            # If libdrm.so missing but libdrm.so.2 present, symlink
            if [ ! -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so ] && [ -f /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so.2 ]; then
              ln -sf libdrm.so.2 /arm-root/usr/lib/arm-linux-gnueabihf/libdrm.so
              echo "  Created libdrm.so symlink"
            fi

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file git
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            cd rkgame-rebuild
            set +e
            bash build.sh output/rkgame > build.log 2>&1
            BUILD_STATUS=$?
            set -e
            git config user.email "cnb@lieguch"
            git config user.name "CNB-Build"
            git checkout -B artifacts
            git add build.log
            if [ $BUILD_STATUS -eq 0 ] && [ -f output/rkgame ]; then
              git add output/rkgame
              git commit -m "auto: rkgame build artifact ($(stat -c%s output/rkgame) bytes)"
              git push origin artifacts --force
              git checkout main
              echo "BUILD DONE"
            else
              git commit -m "auto: build FAILED (status=$BUILD_STATUS)"
              git push origin artifacts --force
              git checkout main
              echo "BUILD FAILED (status=$BUILD_STATUS)"
              cat build.log
              exit $BUILD_STATUS
            fi

        - name: test-emu
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends qemu-user-static
            qemu-arm-static --version | head -3
            export SYSROOT=/arm-root
            mkdir -p /sdcard/cubegm /tmp
            # Truncate pre-existing logs so the run is clean.
            : > /sdcard/cubegm/rkgame.log
            rm -f /sdcard/cubegm/rkgame.crash.log /tmp/rkgame.log
            cd rkgame-rebuild
            # Build stage did 'git checkout main', which removed output/rkgame.
            # Checkout artifacts to get the binary back.
            git checkout artifacts 2>/dev/null || git checkout -f artifacts
            set +e
            echo "=== Running rkgame under qemu-arm (8s timeout) ==="
            echo "Binary: $(stat -c%s output/rkgame) bytes"
            timeout 8 qemu-arm-static -L /arm-root -cpu cortex-a7 \
                -E LD_LIBRARY_PATH=/arm-root/lib/arm-linux-gnueabihf \
                -E PATH=/arm-root/usr/bin:/usr/bin:/bin \
                -E HOME=/tmp \
                -E TMPDIR=/tmp \
                ./output/rkgame > test-emu.log 2>&1
            EXIT_CODE=$?
            set -e
            echo "=== child stdout/stderr ==="
            cat test-emu.log
            echo "=== device-side session log ==="
            cat /sdcard/cubegm/rkgame.log 2>/dev/null || echo "(no device log)"
            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              echo "=== crash log ==="; cat /sdcard/cubegm/rkgame.crash.log
            fi
            HAS_BANNER=0; grep -q "rkgame rebuild starting" /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_BANNER=1
            HAS_START=0;  grep -q "session start"           /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_START=1
            if [ $EXIT_CODE -eq 124 ] && [ $HAS_BANNER -eq 1 ] && [ $HAS_START -eq 1 ]; then
              RESULT="PASS (timeout; session alive)"
            elif [ $EXIT_CODE -eq 0 ]; then
              RESULT="PASS (clean exit)"
            else
              RESULT="FAIL (exit=$EXIT_CODE)"
            fi
            echo "=== RESULT: $RESULT (exit=$EXIT_CODE) ==="
            git config user.email "cnb@lieguch"
            git config user.name "CNB-Build"
            git checkout -B artifacts
            git add test-emu.log 2>/dev/null || true
            cp /sdcard/cubegm/rkgame.log ./test-emu-device.log 2>/dev/null || true
            git add test-emu-device.log 2>/dev/null || true
            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              cp /sdcard/cubegm/rkgame.crash.log ./test-emu-crash.log
              git add test-emu-crash.log 2>/dev/null || true
            fi
            git commit -m "auto: qemu test $RESULT (exit=$EXIT_CODE)"
            git push origin artifacts --force
            git checkout main
            echo "TEST DONE ($RESULT)"
            exit 0

    # =====================================================================
    # 1to1 Linux-only 门禁（2026-09-28 新增）
    #   目的：关闭"11 道门禁在 Windows/Git Bash 上跑不了（缺 arm objdump/readelf）"
    #         这条长期只写在诚实声明里、从未闭合的缺口。
    #   触发：api_trigger_build（手动/API 触发，不在每次 push 跑，省额度）
    #   依赖：1to1/golden/factory.rkgame.bin（已在镜像清单内）
    #   ★ 为什么不走交互式云开发：实测容器会周期性重启（观测到 `up 3 min`）
    #     ＋ 约 15 分钟自动关闭（duration≈924s 后 closed）⇒ 上传与执行拆成两次
    #     SSH 就会因重启丢 /tmp，表现为"命令没有任何输出"。
    # =====================================================================
    - name: 1to1-linux-gates
      docker:
        image: ubuntu:22.04
      env:
        PIP_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple/
        DEBIAN_FRONTEND: noninteractive
      stages:
        - name: deps
          timeout: 30m
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              binutils-arm-linux-gnueabihf python3 python3-pip \
              python3-pyelftools ca-certificates git
            command -v arm-linux-gnueabihf-objdump
            python3 -m pip install -q --break-system-packages pyelftools capstone unicorn \
              || python3 -m pip install -q pyelftools capstone unicorn
            python3 -c "import elftools, capstone, unicorn; print('deps OK')"

        - name: build-1to1
          timeout: 2h
          script: |
            set -e
            cd 1to1
            echo "== 复用项目自己的环境引导（apt + sysroot + shim + 1:1 产物，幂等）=="
            sh tools/cnb_env.sh --fast || sh tools/cnb_env.sh
            ls -la build/rkgame.rebuilt.elf
            sha256sum build/rkgame.rebuilt.elf

        - name: linux-only-gates
          timeout: 1h
          script: |
            set -e
            cd 1to1
            sh tools/cnb_gates.sh || true
            if [ -f /tmp/cnb_gates.txt ]; then cp /tmp/cnb_gates.txt gate-report.txt; fi
            echo "== 摘要 =="
            grep -aE "rc=[0-9]+$|结论|★|失败项数" /tmp/cnb_gates.txt 2>/dev/null | tail -30 || true

        - name: publish-log
          timeout: 10m
          allowFailure: true
          script: |
            cd 1to1
            cp -f /tmp/cnb_gates.txt gate-report.txt 2>/dev/null || echo "(no /tmp/cnb_gates.txt)" > gate-report.txt
            cd ..
            git config user.email "cnb@lieguch"
            git config user.name "CNB-Gates"
            git checkout -B artifacts-gates
            git add -f 1to1/gate-report.txt 2>/dev/null || true
            git commit -m "auto: 1to1 linux-only gates report" || true
            git push origin artifacts-gates --force || true
            git checkout main || true
            echo "LOG DONE"
