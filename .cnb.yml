main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write

      stages:
        - name: setup-sysroot
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"
            else
              echo "=== Enabling armhf multiarch ==="
              apt-get update -qq
              dpkg --add-architecture armhf
              apt-get update -qq

              echo "=== Adding Debian stretch armhf repos ==="
              cat > /etc/apt/sources.list.d/stretch-armhf.list <<'EOF'
              deb [arch=armhf] http://archive.debian.org/debian stretch main
              deb-src [arch=armhf] http://archive.debian.org/debian stretch main
              EOF
              apt-get update -qq

              echo "=== Downloading ARM sysroot packages ==="
              mkdir -p /tmp/arm-pkgs
              cd /tmp/arm-pkgs

              # Download core ARM packages from stretch
              apt-get download -t stretch \
                libc6:armhf libc6-dev:armhf \
                libstdc++6:armhf libgcc1:armhf \
                linux-libc-dev:armhf \
                libc-bin:armhf libm6:armhf \
                2>&1 | tail -5

              echo "=== Extracting to /tmp/arm-root ==="
              mkdir -p /tmp/arm-root
              for deb in /tmp/arm-pkgs/*.deb; do
                dpkg-deb -x "$deb" /tmp/arm-root/
              done

              echo "=== Copying to /arm-root (cached volume) ==="
              mkdir -p /arm-root
              cp -a /tmp/arm-root/. /arm-root/

              echo "=== Verifying ==="
              ls /arm-root/lib/arm-linux-gnueabihf/libc.so 2>/dev/null && echo "OK libc"
              find /arm-root -name "libdl*" 2>/dev/null | head -5
              find /arm-root -name "libstdc++*" 2>/dev/null | head -5
            fi

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
              binutils-arm-linux-gnueabihf file

            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root

            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"

            cd rkgame-rebuild
            bash build.sh output/rkgame

        - name: abi-check
          script: |
            set -e
            OUT=rkgame-rebuild/output/rkgame
            file "$OUT"
            FLAGS=$(readelf -h "$OUT" | grep "Flags:" | awk '{print $2}' | tr -d ',')
            HEX_FLAGS=$(printf "%d" "${FLAGS}")
            test $(( (HEX_FLAGS >> 9) & 0x3 )) -eq 2
            arm-linux-gnueabihf-objdump -T "$OUT" | head -50
            if arm-linux-gnueabihf-objdump -T "$OUT" | grep -qE "GLIBC_2\.(3[4-9]|4[0-9]|5[0-9])"; then
              echo "FATAL: GLIBC_2.34+"; exit 1
            fi
            echo "ABI PASSED"
