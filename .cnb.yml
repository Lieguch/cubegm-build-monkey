main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write

      stages:
        - name: setup-sysroot
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # /arm-root is mounted with nodev — debootstrap cannot mknod there.
            # Build in /tmp (tmpfs, no restrictions) then copy to /arm-root.
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached at /arm-root"
            else
              echo "=== Installing debootstrap ==="
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                debootstrap wget ca-certificates apt-transport-https

              echo "=== Building glibc 2.25 ARMHF sysroot in /tmp ==="
              debootstrap --arch=armhf --no-check-gpg \
                --variant=minbase \
                stretch /tmp/arm-root http://archive.debian.org/debian

              echo "=== Copying to cached volume ==="
              mkdir -p /arm-root
              cp -a /tmp/arm-root/. /arm-root/

              echo "=== Verifying ==="
              ls /arm-root/lib/arm-linux-gnueabihf/libc.so
              find /arm-root -name "libdl*" | head -5
            fi

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
              binutils-arm-linux-gnueabihf file

            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root

            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"

            cd rkgame-rebuild
            bash build.sh output/rkgame

        - name: abi-check
          script: |
            set -e
            OUT=rkgame-rebuild/output/rkgame
            test -f "$OUT"

            file "$OUT"
            FLAGS=$(readelf -h "$OUT" | grep "Flags:" | awk '{print $2}' | tr -d ',')
            echo "e_flags=${FLAGS}"
            HEX_FLAGS=$(printf "%d" "${FLAGS}")
            FLOAT_ABI=$(( (HEX_FLAGS >> 9) & 0x3 ))
            echo "Float ABI: $FLOAT_ABI"
            test "$FLOAT_ABI" = "2"

            arm-linux-gnueabihf-objdump -T "$OUT" | head -50

            if arm-linux-gnueabihf-objdump -T "$OUT" | grep -qE "GLIBC_2\.(3[4-9]|4[0-9]|5[0-9])"; then
              echo "FATAL: GLIBC_2.34+ found"
              exit 1
            fi
            echo "ABI PASSED"
