              echo "BUILD DONE"
            else
              git commit -m "auto: build FAILED (status=$BUILD_STATUS)"
              git push origin artifacts --force
              git checkout main
              echo "BUILD FAILED (status=$BUILD_STATUS)"
              cat build.log
              exit $BUILD_STATUS
            fi

        - name: test-emu
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends qemu-user-static
            qemu-arm-static --version | head -3
            export SYSROOT=/arm-root
            mkdir -p /sdcard/cubegm /tmp
            # Truncate pre-existing logs so the run is clean.
            : > /sdcard/cubegm/rkgame.log
            rm -f /sdcard/cubegm/rkgame.crash.log /tmp/rkgame.log
            cd rkgame-rebuild
            # Build stage did 'git checkout main', which removed output/rkgame.
            # Checkout artifacts to get the binary back.
            git checkout artifacts 2>/dev/null || git checkout -f artifacts
            set +e
            echo "=== Running rkgame under qemu-arm (8s timeout) ==="
            echo "Binary: $(stat -c%s output/rkgame) bytes"
            timeout 8 qemu-arm-static -L /arm-root -cpu cortex-a7 \
                -E LD_LIBRARY_PATH=/arm-root/lib/arm-linux-gnueabihf \
                -E PATH=/arm-root/usr/bin:/usr/bin:/bin \
                -E HOME=/tmp \
                -E TMPDIR=/tmp \
                ./output/rkgame > test-emu.log 2>&1
            EXIT_CODE=$?
            set -e
            echo "=== child stdout/stderr ==="
            cat test-emu.log
            echo "=== device-side session log ==="
            cat /sdcard/cubegm/rkgame.log 2>/dev/null || echo "(no device log)"
            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              echo "=== crash log ==="; cat /sdcard/cubegm/rkgame.crash.log
            fi
            HAS_BANNER=0; grep -q "rkgame rebuild starting" /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_BANNER=1
            HAS_START=0;  grep -q "session start"           /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_START=1
            if [ $EXIT_CODE -eq 124 ] && [ $HAS_BANNER -eq 1 ] && [ $HAS_START -eq 1 ]; then
              RESULT="PASS (timeout; session alive)"
            elif [ $EXIT_CODE -eq 0 ]; then
              RESULT="PASS (clean exit)"
            else
              RESULT="FAIL (exit=$EXIT_CODE)"
            fi
            echo "=== RESULT: $RESULT (exit=$EXIT_CODE) ==="
            git config user.email "cnb@lieguch"
            git config user.name "CNB-Build"
            git checkout -B artifacts
            git add test-emu.log 2>/dev/null || true
            cp /sdcard/cubegm/rkgame.log ./test-emu-device.log 2>/dev/null || true
            git add test-emu-device.log 2>/dev/null || true
            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              cp /sdcard/cubegm/rkgame.crash.log ./test-emu-crash.log
              git add test-emu-crash.log 2>/dev/null || true
            fi
            git commit -m "auto: qemu test $RESULT (exit=$EXIT_CODE)"
            git push origin artifacts --force
            git checkout main
            echo "TEST DONE ($RESULT)"
            exit 0
