main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
          - /build-output:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"; exit 0
            fi
            mkdir -p /tmp/arm-pkgs /tmp/arm-root
            cd /tmp/arm-pkgs
            BASE=http://archive.debian.org/debian/pool/main
            wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
            wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
            for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
            find /tmp/arm-root -name "libc.so" -path "*arm-linux*"
            mkdir -p /arm-root
            cp -a /tmp/arm-root/. /arm-root/
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"
            cd rkgame-rebuild
            bash build.sh output/rkgame
            ls -la output/rkgame
            mkdir -p /build-output
            cp output/rkgame /build-output/rkgame
            echo "cp done: $(ls -la /build-output/)"
            echo "BUILD DONE"

        - name: upload
          script: |
            set -e
            apt-get update -qq && apt-get install -y --no-install-recommends curl || true
            ls -la /build-output/ || { echo "no /build-output"; exit 1; }
            cp /build-output/rkgame /tmp/rkgame
            ls -la /tmp/rkgame
            # Use CNB commit-assets API with hardcoded token
            TOKEN=30BG1a42ZeeRcRVqDn7Oe9466mE
            API=https://api.cnb.cool
            SLUG=lieguch/cubeGM
            # Get CNB_COMMIT from git log
            cd rkgame-rebuild 2>/dev/null || cd ..
            COMMIT=$(git rev-parse HEAD)
            echo "COMMIT=$COMMIT"
            [ -n "$COMMIT" ] || { echo "COMMIT missing"; exit 1; }
            sha256=$(sha256sum /tmp/rkgame | awk '{print $1}')
            SIZE=$(stat -c%s /tmp/rkgame)
            echo "sha256=$sha256 size=$SIZE"
            RESP=$(curl -sS -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "{\"asset_name\":\"rkgame\",\"size\":$SIZE}" \
              "$API/$SLUG/-/git/commit-assets/$COMMIT/asset-upload-url")
            echo "RESP=$RESP"
            UPLOAD_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['upload_url'])")
            VERIFY_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['verify_url'])")
            echo "UPLOAD_URL set: ${#UPLOAD_URL}"
            curl -sS -X PUT -T /tmp/rkgame "$UPLOAD_URL"
            echo "PUT done"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" "$VERIFY_URL"
            echo "VERIFY done"
            echo "DOWNLOAD_URL: $API/$SLUG/-/commit-assets/download/$COMMIT/rkgame"
            echo "UPLOAD DONE"

