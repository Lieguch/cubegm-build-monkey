main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"; exit 0
            fi
            mkdir -p /tmp/arm-pkgs /tmp/arm-root
            cd /tmp/arm-pkgs
            BASE=http://archive.debian.org/debian/pool/main
            wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
            wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
            for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
            find /tmp/arm-root -name "libc.so" -path "*arm-linux*"
            mkdir -p /arm-root
            cp -a /tmp/arm-root/. /arm-root/
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"
            cd rkgame-rebuild
            bash build.sh output/rkgame
            ls -la output/rkgame
            echo "BUILD DONE"

        - name: pack-and-upload
          script: |
            set -ex
            apt-get update -qq && apt-get install -y --no-install-recommends curl git python3 || true
            echo "=== ENV DIAG ==="
            env | grep CNB | sed 's/CNB_TOKEN=*/CNB_TOKEN=*** /' || true
            echo "CNB_TOKEN_len=${#CNB_TOKEN:-0}"
            echo "CNB_API_ENDPOINT=${CNB_API_ENDPOINT:-MISSING}"
            echo "CNB_REPO_SLUG=${CNB_REPO_SLUG:-MISSING}"
            echo "CNB_COMMIT=${CNB_COMMIT:-MISSING}"
            cd rkgame-rebuild
            BINARY="output/rkgame"
            [ -f "$BINARY" ] || { echo "BINARY not found"; exit 1; }
            file "$BINARY"
            # Method A: upload via commit-assets API (preferred)
            if [ -n "$CNB_TOKEN" ] && [ -n "$CNB_API_ENDPOINT" ] && [ -n "$CNB_REPO_SLUG" ] && [ -n "$CNB_COMMIT" ]; then
              echo "=== Attempting commit-assets upload ==="
              tar -czf dist.tar.gz "$BINARY"
              FILE_SIZE=$(stat -c%s dist.tar.gz)
              RESP=$(curl -sS -X POST \
                -H "Authorization: Bearer $CNB_TOKEN" \
                -H "Content-Type: application/json" \
                -H "Accept: application/vnd.cnb.api+json" \
                -d "{\"asset_name\":\"dist.tar.gz\",\"size\":$FILE_SIZE}" \
                "${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/git/commit-assets/${CNB_COMMIT}/asset-upload-url")
              echo "RESP=$RESP"
              if echo "$RESP" | grep -q '"upload_url"'; then
                SIGNED_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['upload_url'])")
                VERIFY_URL=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['verify_url'])")
                curl -sS -X PUT -T dist.tar.gz "$SIGNED_URL" && echo "PUT OK"
                curl -sS -X POST -H "Authorization: Bearer $CNB_TOKEN" "$VERIFY_URL" && echo "VERIFY OK"
                echo "DOWNLOAD: ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/commit-assets/download/${CNB_COMMIT}/dist.tar.gz"
              else
                echo "API failed: $RESP"
              fi
            else
              echo "CNB_TOKEN unavailable, skipping API upload"
            fi
            # Method B: commit binary directly to repo
            echo "=== Committing binary to repo ==="
            git config user.email "cnb@lieguch"
            git config user.name "CNB"
            git add "$BINARY"
            git commit -m "auto: rkgame binary ($(stat -c%s "$BINARY") bytes)" || echo "nothing to commit"
            git push origin main || echo "git push failed"
            echo "DONE"

