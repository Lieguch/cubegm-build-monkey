main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates
            if [ -f /arm-root/lib/arm-linux-gnueabihf/libc.so ]; then
              echo "Sysroot cached"; exit 0
            fi
            mkdir -p /tmp/arm-pkgs /tmp/arm-root
            cd /tmp/arm-pkgs
            BASE=http://archive.debian.org/debian/pool/main
            wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
            wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
            wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
            for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
            find /tmp/arm-root -name "libc.so" -path "*arm-linux*"
            mkdir -p /arm-root
            cp -a /tmp/arm-root/. /arm-root/
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            file "$SYSROOT/lib/arm-linux-gnueabihf/libc.so"
            cd rkgame-rebuild
            bash build.sh output/rkgame
            ls -la output/rkgame
            echo "BUILD DONE"

        - name: pack-and-upload
          script: |
            set -ex
            apt-get update -qq && apt-get install -y --no-install-recommends curl python3 || true
            echo "=== ENV DIAG ==="
            echo "CNB_API_ENDPOINT=${CNB_API_ENDPOINT:-MISSING}"
            echo "CNB_REPO_SLUG=${CNB_REPO_SLUG:-MISSING}"
            echo "CNB_COMMIT=${CNB_COMMIT:-MISSING}"
            echo "CNB_BRANCH=${CNB_BRANCH:-MISSING}"
            echo "CNB_TOKEN_len=${#CNB_TOKEN:-0}"
            echo "curl=$(which curl 2>/dev/null || echo MISSING)"
            echo "tar=$(which tar 2>/dev/null || echo MISSING)"
            cd rkgame-rebuild
            ls -la output/ || true
            BINARY="output/rkgame"
            [ -f "$BINARY" ] || { echo "BINARY not found"; exit 1; }
            tar -czf dist.tar.gz "$BINARY"
            FILE_SIZE=$(stat -c%s dist.tar.gz)
            echo "dist.tar.gz size=$FILE_SIZE"
            echo "=== Step 1: get upload URL ==="
            curl -sSv -X POST \
              -H "Authorization: Bearer $CNB_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.cnb.api+json" \
              -d "{\"asset_name\":\"dist.tar.gz\",\"size\":$FILE_SIZE}" \
              "${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/git/commit-assets/${CNB_COMMIT}/asset-upload-url" \
              -o /tmp/upload_resp.json 2>&1 || { echo "CURL_FAILED"; cat /tmp/upload_resp.json 2>/dev/null; exit 1; }
            cat /tmp/upload_resp.json
            echo
            SIGNED_URL=$(python3 -c "import json,sys;d=json.load(open('/tmp/upload_resp.json'));print(d.get('upload_url',''))" 2>/dev/null || echo "PARSE_FAIL")
            VERIFY_URL=$(python3 -c "import json,sys;d=json.load(open('/tmp/upload_resp.json'));print(d.get('verify_url',''))" 2>/dev/null || echo "PARSE_FAIL")
            echo "SIGNED_URL=***${#SIGNED_URL}"
            echo "VERIFY_URL=***${#VERIFY_URL}"
            [ "$SIGNED_URL" = "PARSE_FAIL" ] || [ -z "$SIGNED_URL" ] && { echo "No upload_url"; exit 1; }
            echo "=== Step 2: PUT file ==="
            curl -sSv -X PUT -T dist.tar.gz "$SIGNED_URL" 2>&1 || exit 1
            echo "=== Step 3: verify ==="
            curl -sSv -X POST -H "Authorization: Bearer $CNB_TOKEN" -H "Accept: application/vnd.cnb.api+json" "$VERIFY_URL" 2>&1 || exit 1
            echo "DOWNLOAD_URL: ${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/commit-assets/download/${CNB_COMMIT}/dist.tar.gz"
            echo "UPLOAD DONE"

