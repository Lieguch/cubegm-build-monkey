main:
  push:
    - name: rkgame-rebuild
      docker:
        image: ubuntu:22.04
        volumes:
          - /arm-root:copy-on-write
      stages:
        - name: setup-sysroot
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends wget dpkg-dev ca-certificates

            # If sysroot not yet built, download Debian 9 packages
            if [ ! -f /arm-root/usr/lib/arm-linux-gnueabihf/libc.so ]; then
              mkdir -p /tmp/arm-pkgs /tmp/arm-root
              cd /tmp/arm-pkgs
              BASE=http://archive.debian.org/debian/pool/main
              wget -q "$BASE/g/glibc/libc6_2.24-11+deb9u4_armhf.deb"
              wget -q "$BASE/g/glibc/libc6-dev_2.24-11+deb9u4_armhf.deb"
              wget -q "$BASE/g/glibc/libc-bin_2.24-11+deb9u4_armhf.deb"
              wget -q "$BASE/g/gcc-6/libstdc++6_6.3.0-18+deb9u1_armhf.deb"
              wget -q "$BASE/g/gcc-6/libgcc1_6.3.0-18+deb9u1_armhf.deb"
              # DRM/KMS headers + runtime (for Phase 4 display layer)
              wget -q "$BASE/l/linux/linux-libc-dev_4.9.228-1_armhf.deb"
              wget -q "$BASE/libd/libdrm/libdrm2_2.4.97-1_armhf.deb"
              wget -q "$BASE/libd/libdrm/libdrm-dev_2.4.97-1_armhf.deb"
              for deb in *.deb; do dpkg-deb -x "$deb" /tmp/arm-root/; done
              mkdir -p /arm-root
              cp -a /tmp/arm-root/. /arm-root/
              echo "SYSROOT downloaded"
            else
              echo "SYSROOT cached, applying symlink fixes..."
            fi

            # ALWAYS fix broken absolute symlinks (not just on first setup).
            # Debian 9 packages ship libdl.so/libm.so/libpthread.so as
            # symlinks to absolute paths like /lib/arm-linux-gnueabihf/*.so.2.
            # These don't exist on CNB host. Replace with RELATIVE symlinks
            # so the linker can resolve them within the sysroot.
            # Also fix libc.so linker script: replace absolute paths with
            # relative (same-dir) paths so --sysroot is not needed.
            LIBDIR=/arm-root/usr/lib/arm-linux-gnueabihf
            RUNDIR=/arm-root/lib/arm-linux-gnueabihf

            # libdl.so -> ../../../lib/arm-linux-gnueabihf/libdl.so.2
            ln -sf ../../../lib/arm-linux-gnueabihf/libdl.so.2 "$LIBDIR/libdl.so"
            # libm.so -> ../../../lib/arm-linux-gnueabihf/libm.so.6
            ln -sf ../../../lib/arm-linux-gnueabihf/libm.so.6 "$LIBDIR/libm.so"
            # libpthread.so -> ../../../lib/arm-linux-gnueabihf/libpthread.so.0
            ln -sf ../../../lib/arm-linux-gnueabihf/libpthread.so.0 "$LIBDIR/libpthread.so"

            # libc.so is a linker script. The script is in /usr/lib/...
            # but libc.so.6 is in /lib/... and libc_nonshared.a is in /usr/lib/...
            # Use relative paths: ../../../lib/... for libc.so.6, same-dir for libc_nonshared.a
            printf '/* GNU ld script\n   Use libc.so.6 and libc_nonshared.a if available\n   */\nGROUP ( AS_NEEDED ( ../../../lib/arm-linux-gnueabihf/libc.so.6 libc_nonshared.a ) )\n' > "$LIBDIR/libc.so"
            echo "Fixed libc.so linker script (relative paths)"

            # The device's dynamic linker is at /lib/ld-linux-armhf.so.3
            # (NOT /lib/arm-linux-gnueabihf/ld-linux-armhf.so.3).
            # Our --dynamic-linker flag must match the device's path.
            # Ensure the sysroot has the linker at /arm-root/lib/ld-linux-armhf.so.3
            if [ -f "$RUNDIR/ld-linux-armhf.so.3" ] && [ ! -f /arm-root/lib/ld-linux-armhf.so.3 ]; then
              ln -sf arm-linux-gnueabihf/ld-linux-armhf.so.3 /arm-root/lib/ld-linux-armhf.so.3
              echo "Created symlink: /arm-root/lib/ld-linux-armhf.so.3"
            elif [ -f /arm-root/lib/ld-linux-armhf.so.3 ]; then
              echo "Dynamic linker already at /arm-root/lib/ld-linux-armhf.so.3"
            else
              echo "WARNING: ld-linux-armhf.so.3 not found in either location"
            fi

            # Verify all fixed symlinks resolve
            echo "Verifying symlinks..."
            for f in libdl.so libm.so libpthread.so; do
              target=$(readlink -f "$LIBDIR/$f")
              echo "  $f -> $target"
              if [ ! -f "$target" ]; then
                echo "FATAL: $f target not found: $target"
                exit 1
              fi
            done
            echo "SYSROOT ready"

        - name: build
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf file git
            export CC=arm-linux-gnueabihf-gcc
            export SYSROOT=/arm-root
            "$CC" --version
            cd rkgame-rebuild
            set +e
            bash build.sh output/rkgame > build.log 2>&1
            BUILD_STATUS=$?
            set -e
            git config user.email "cnb@lieguch"
            git config user.name "CNB-Build"
            git checkout -B artifacts
            git add build.log
            if [ $BUILD_STATUS -eq 0 ] && [ -f output/rkgame ]; then
              git add output/rkgame
              git commit -m "auto: rkgame build artifact ($(stat -c%s output/rkgame) bytes)"
              git push origin artifacts --force
              git checkout main
              echo "BUILD DONE"
            else
              git commit -m "auto: build FAILED (status=$BUILD_STATUS)"
              git push origin artifacts --force
              git checkout main
              echo "BUILD FAILED (status=$BUILD_STATUS)"
              cat build.log
              exit $BUILD_STATUS
            fi

        - name: test-emu
          script: |
            set -e
            apt-get update -qq
            apt-get install -y --no-install-recommends qemu-user-static
            qemu-arm-static --version | head -3

            export SYSROOT=/arm-root

            # Prepare clean log paths (dbg_init opens with O_APPEND, so any
            # pre-existing content would bleed into this run).
            mkdir -p /sdcard/cubegm /tmp
            : > /sdcard/cubegm/rkgame.log
            rm -f /sdcard/cubegm/rkgame.crash.log /tmp/rkgame.log

            # Build stage did 'git checkout main' at the end, which removed
            # output/rkgame. Checkout artifacts to get the binary back.
            cd rkgame-rebuild
            git checkout artifacts 2>/dev/null || git checkout -f artifacts

            set +e

            echo "=== Running rkgame under qemu-arm (8s timeout) ==="
            echo "Binary: $(stat -c%s output/rkgame) bytes"
            echo "Note: main_menu() intentionally blocks; exit=124 (timeout) is the expected PASS outcome."

            # Capture child stdout/stderr into test-emu.log.
            # dbg_init() first prints the banner to fd 2, then dup2's fd 2
            # to the device-side log fd. So test-emu.log will only contain
            # the pre-redirect banner; the full session goes to /sdcard/cubegm/rkgame.log.
            timeout 8 qemu-arm-static -L /arm-root -cpu cortex-a7 \
                -E LD_LIBRARY_PATH=/arm-root/lib/arm-linux-gnueabihf \
                -E PATH=/arm-root/usr/bin:/usr/bin:/bin \
                -E HOME=/tmp \
                -E TMPDIR=/tmp \
                ./output/rkgame > test-emu.log 2>&1
            EXIT_CODE=$?
            set -e

            echo ""
            echo "=== child stdout/stderr (test-emu.log) ==="
            cat test-emu.log

            echo ""
            echo "=== device-side session log (/sdcard/cubegm/rkgame.log) ==="
            if [ -f /sdcard/cubegm/rkgame.log ]; then
              cat /sdcard/cubegm/rkgame.log
            else
              echo "(no device-side log file)"
            fi

            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              echo ""
              echo "=== CRASH LOG (/sdcard/cubegm/rkgame.crash.log) ==="
              cat /sdcard/cubegm/rkgame.crash.log
            fi

            # PASS/FAIL criteria:
            #   PASS: exit=124 (timeout from blocking main_menu) AND session banner + start in device log
            #   PASS: exit=0 (clean shutdown)
            #   FAIL: any other exit code (crash, symbol resolution error, etc.)
            HAS_BANNER=0; grep -q "rkgame rebuild starting" /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_BANNER=1
            HAS_START=0;  grep -q "session start"           /sdcard/cubegm/rkgame.log 2>/dev/null && HAS_START=1

            if [ $EXIT_CODE -eq 124 ] && [ $HAS_BANNER -eq 1 ] && [ $HAS_START -eq 1 ]; then
              RESULT="PASS (timeout; session alive)"
            elif [ $EXIT_CODE -eq 0 ]; then
              RESULT="PASS (clean exit)"
            else
              RESULT="FAIL (exit=$EXIT_CODE)"
            fi

            echo ""
            echo "=== RESULT: $RESULT (exit=$EXIT_CODE, banner=$HAS_BANNER, start=$HAS_START) ==="

            git config user.email "cnb@lieguch"
            git config user.name "CNB-Build"
            git checkout -B artifacts
            git add test-emu.log 2>/dev/null || true
            # Preserve the device-side session log as a separate artifact so
            # reviewers can read the actual dbg_log output.
            cp /sdcard/cubegm/rkgame.log ./test-emu-device.log 2>/dev/null || true
            git add test-emu-device.log 2>/dev/null || true
            if [ -f /sdcard/cubegm/rkgame.crash.log ]; then
              cp /sdcard/cubegm/rkgame.crash.log ./test-emu-crash.log
              git add test-emu-crash.log 2>/dev/null || true
            fi
            git commit -m "auto: qemu test $RESULT (exit=$EXIT_CODE)"
            git push origin artifacts --force
            git checkout main
            echo "TEST DONE ($RESULT)"
            exit 0

