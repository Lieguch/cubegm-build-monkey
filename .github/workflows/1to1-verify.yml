name: 1to1-verify

on:
  workflow_dispatch:
  push:
    paths:
      - '1to1/**'
      - '.github/workflows/1to1-verify.yml'

permissions:
  contents: read

jobs:
  p2a-stb:
    name: P2-A stb_truetype 版本锁定
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ARM 交叉工具链（armv7 hard-float）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -1
          arm-linux-gnueabihf-objdump --version | head -1

      - name: 安装 zig（与本地同一工具链 ⇒ GLIBC 下限可控、避免 GCC/lld 差异）
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ziglang==0.16.0
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          chmod +x "$ZIG"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          # ★ CC 必须用 zig：只有 `-target arm-linux-gnueabihf.<glibc版本>` 才能把产物的
          #   GLIBC 下限钉到设备可用区间 —— 实测工厂 rkgame 只要 GLIBC_2.7，而 Ubuntu 22.04
          #   的 GCC 会产出 GLIBC_2.29/2.33/2.34 ⇒ 拿到真机上 `version GLIBC_2.34 not found`
          #   直接起不来。dyn_audit 的 A7 门禁专门拦这一条。
          echo "CC=$ZIG cc" >> "$GITHUB_ENV"
          # ★ 并发 zig 共用同一 global cache 会 CacheCheckFailed ⇒ 每 job 独立 cache
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zigcache" >> "$GITHUB_ENV"
          "$ZIG" version

      - name: 校验金标准完整性
        run: |
          python3 - <<'PY'
          import gzip, json
          d = json.load(gzip.open('1to1/golden/factory.funcs.json.gz', 'rt', encoding='utf-8'))
          f = d['functions']
          n = sum(x['n'] for x in f.values())
          print('golden functions=%d instructions=%d' % (len(f), n))
          assert len(f) == 835, 'golden 函数数异常（应 835）'
          assert n == 715473, 'golden 指令数异常（应 715473）'
          print('golden integrity OK')
          PY

      - name: 解压金标准
        run: gunzip -k -f 1to1/golden/factory.funcs.json.gz

      - name: 结构语义指纹门禁自检（期望 100% S1）
        run: |
          cd 1to1
          python3 tools/structsig.py golden/factory.funcs.json golden/factory.funcs.json

      - name: N3 ABI 门禁（验证可用工具链能产出工厂 ABI 的 ELF）
        run: |
          cd 1to1
          printf 'int main(void){return 0;}\n' > /tmp/tu.c
          arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfloat-abi=hard -mfpu=neon \
            -no-pie /tmp/tu.c -o /tmp/tu
          echo '--- 产出 ELF 规格 ---'
          readelf -h /tmp/tu | grep -E 'Type|Machine|Flags'
          echo '--- 对比原厂规格 ---'
          python3 tools/abi_check.py /tmp/tu

      - name: P2-A stb_truetype 版本指纹锁定
        run: |
          cd 1to1
          mkdir -p report
          CC=arm-linux-gnueabihf-gcc OBJDUMP=arm-linux-gnueabihf-objdump \
            python3 tools/ci_p2a_stb.py golden/factory.funcs.json.gz report/p2a_stb.txt
          echo '--- report ---'
          cat report/p2a_stb.txt

      - name: 类型可解析性自检（生成物健全性）
        run: |
          cd 1to1
          python3 tools/check_types.py

      - name: 数组名转型扫描（Ghidra 把 `arr[0]` 误渲染成 `(窄类型)arr`）★ 硬门禁
        run: |
          cd 1to1
          # ★ 血泪：工厂 `spi_driver_init` 的判断原指令是 `ldrb r3,[r6]`（r6=&spi_id），
          #   Ghidra 渲染成 `(gh_byte)spi_id` —— 在「spi_id 是数组」的声明下它变成
          #   **指针→字节转换**（取地址最低字节 0xc8，而真值是 0x0b）⇒ 判断走错分支
          #   ⇒ main() 不去 main_Menu()。编译/链接/ABI/布局全部是绿的，只有行为差分能发现。
          #   本步骤把该类误渲染变成**静态可拦**。
          python3 tools/scan_array_casts.py

      - name: 重建编译门禁（双轨：宽松语法 + 严格类型，硬门禁假绿=0）
        run: |
          cd 1to1
          mkdir -p report
          sh tools/recon_build.sh report/recon_build.txt

      - name: P3 链接就绪审计（符号层：重复定义 / 未解析引用分类）★ 硬门禁
        run: |
          cd 1to1
          mkdir -p report
          rc=0
          PY=python3 sh tools/link_audit.sh report/link_audit.txt || rc=$?
          echo "link_audit 退出码 = $rc"
          echo '--- 审计要点 ---'
          grep -aE '重复定义|未解析引用|MISSING|upstream|结论' report/link_audit.txt | head -8
          # ★ 硬断言：重复定义 与 MISSING 必须为 0
          #   （此前本步骤带 continue-on-error: true，失败被静默掩盖 = 假绿）
          python3 - <<'PY'
          import re, sys
          t = open('report/link_audit.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'重复定义[^:：]*[:：]\s*(\d+)', t)
          assert m, '无法解析「重复定义」计数'
          dup = int(m.group(1))
          miss = len([l for l in open('report/_link_missing.txt', encoding='utf-8', errors='replace')
                      if l.startswith('MISSING')])
          print('硬断言：重复定义=%d  MISSING=%d' % (dup, miss))
          if dup != 0:
              print('::error::重复定义 != 0')
              sys.exit(1)
          if miss != 0:
              print('::error::MISSING != 0（未供应符号）')
              sys.exit(1)
          PY
          [ "$rc" = "0" ] || exit "$rc"

      - name: P3 上游组件编译（stb / mini-XML / Helix MP3 / GNU libiconv）
        run: |
          cd 1to1
          mkdir -p build/upstream
          PY=python3 sh tools/build_upstream.sh build/upstream

      - name: P3 完整链接 + ABI/布局门禁 ★ 硬门禁
        run: |
          cd 1to1
          # 注：数据镜像/链接脚本的「重新生成」需工厂 ELF，只在本地执行（tools/regen_data.sh）；
          #     CI 使用仓库内已提交的 src/data/factory_*.bin + factory_image.S + linker/factory.ld
          PY=python3 sh tools/link_full.sh build/rkgame.rebuilt.elf
          echo '--- 链接错误（应为空）---'
          wc -c report/link_full_err.txt
          echo '--- 布局门禁 ---'
          python3 tools/verify_layout.py build/rkgame.rebuilt.elf ledger/factory_globals.tsv
          echo '--- 动态段 / 初始化链自洽门禁 ---'
          # ★ 静态即可拦住「DT_INIT=0 → glibc call_init 调到地址 0 → SIGILL」这类致命 bug
          python3 tools/dyn_audit.py build/rkgame.rebuilt.elf
          echo '--- ABI 门禁 ---'
          python3 tools/abi_check.py build/rkgame.rebuilt.elf

      - name: 门禁汇总（写入 Job Summary）
        if: always()
        run: |
          cd 1to1
          {
            echo '## 1to1 门禁汇总'
            echo
            echo '```'
            grep -aE '语法通过率|类型正确率|假绿' report/recon_build.txt 2>/dev/null | head -4
            echo
            grep -aE '重复定义|未解析引用|MISSING|upstream|结论' report/link_audit.txt 2>/dev/null | head -8
            echo
            grep -aE '全局符号命中率|局部符号命中率|受检符号|越界符号|结论' report/verify_layout.txt 2>/dev/null
            echo
            echo "link_full_err 字节数: $(wc -c < report/link_full_err.txt 2>/dev/null || echo n/a)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1to1-p2a-report
          path: 1to1/report/
          if-no-files-found: warn
