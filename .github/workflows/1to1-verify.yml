name: 1to1-verify

on:
  workflow_dispatch:
  push:
    paths:
      - '1to1/**'
      # ★★ 2026-09-20：排除纯文档（理由同 1to1-qemu-behav.yml 的同一处理）。
      - '!1to1/*.md'
      - '.github/workflows/1to1-verify.yml'

permissions:
  contents: read

jobs:
  p2a-stb:
    name: P2-A stb_truetype 版本锁定
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ARM 交叉工具链（armv7 hard-float）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version | head -1
          arm-linux-gnueabihf-objdump --version | head -1

      - name: 安装 zig（与本地同一工具链 ⇒ GLIBC 下限可控、避免 GCC/lld 差异）
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ziglang==0.16.0
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          chmod +x "$ZIG"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          # ★ CC 必须用 zig：只有 `-target arm-linux-gnueabihf.<glibc版本>` 才能把产物的
          #   GLIBC 下限钉到设备可用区间 —— 实测工厂 rkgame 只要 GLIBC_2.7，而 Ubuntu 22.04
          #   的 GCC 会产出 GLIBC_2.29/2.33/2.34 ⇒ 拿到真机上 `version GLIBC_2.34 not found`
          #   直接起不来。dyn_audit 的 A7 门禁专门拦这一条。
          echo "CC=$ZIG cc" >> "$GITHUB_ENV"
          # ★ 并发 zig 共用同一 global cache 会 CacheCheckFailed ⇒ 每 job 独立 cache
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zigcache" >> "$GITHUB_ENV"
          "$ZIG" version

      - name: shim 日志格式化器自检（零-stdio 硬门禁）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-17 实测）：shim 的 `note()` 曾用 `vsnprintf`，在被拦截的 `fopen`
          #   内部调用 ⇒ 在 stdio 内部再入 stdio，把 guest 的 FILE 结构污染成
          #   `blx sl, sl=0x3a`（ASCII ':'）的垃圾跳转，导致重建产物解析 setting.xml 即崩。
          # 本门禁做两件事：① 抽取的格式化器块里**不得出现任何 stdio 调用**（剥注释后检查）；
          #   ② 12 条用例与 snprintf 逐一对拍（%p 用显式期望）——全部通过才算过。
          # ★ `zig` 由 pip 安装在 site-packages 内、**不在 PATH**（实测踩坑：`command -v zig` 为空
          #   ⇒ 门禁直接失败）。这里复用「安装 zig」步骤里同一套解析方式。
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          [ -x "$ZIG" ] || { echo "::error::无法定位 zig（$ZIG）"; exit 1; }
          python tools/shim_fmt_selftest.py --zig "$ZIG"

      - name: 调用点实参对拍（逐调用点，权威=工厂反编译 C）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-17 实测）：`src/compat/proto.h` 里的 K&R 空参声明让调用点**漏参编译通过**，
          #   而 ARM 上被漏掉的参数就是寄存器垃圾 ⇒ 幽灵故障（本轮 `mxmlLoadFile` 漏第 3 参 `cb`
          #   ⇒ `mxml_load_data` 内 `blx r10`，pc = 0x3a/0x00 随场景漂移；修后重建侧覆盖率 4→58）。
          # 口径选择（走过四次弯路，见 tools/scan_call_args.py 的 docstring）：
          #   以**工厂 per-function 反编译 C 的调用表达式**为准，逐 (调用者,被调者) 比较实参个数；
          #   只可能"少算不多算" ⇒ **保守、无假阳性**。内置三个已人工核对的锚点做自证。
          python tools/scan_call_args.py --root .

      - name: 窄指针转型 + 解引用扫描 ★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-17 实测，真实缺陷已定案）：`mui_setting` 里曾写成
          #   `(gh_byte *)*(gh_byte *)puVar15` —— 多一层窄转型使编译器发射**字节读**，
          #   拿到的是**指针低字节**（0..255）再当指针用。工厂机器码为证：
          #   `2b490: ldr r2,[r6,#4]!`（按 +4 取**字**）而我们是 `ldrb r1,[r1,#4]`（取**字节**）。
          #   实测后果：该槽指针低字节 = 0x80 ⇒ 第 6 实参 = 0x80 ⇒
          #   `mui_outputxy_t` 内 `ldrb sl,[r2]` ⇒ SIGSEGV @0x80（崩溃点 +0x84 逐位吻合）。
          # 判据刻意收窄到「内外都是窄指针转型」这一确诊形态（宁可漏报不可乱报）：
          #   合法的 `(char *)*m_search` / `(unsigned char*)*outbuf` / `(gh_byte *)*(gh_u4 *)(p+4)`
          #   都必须放行。构造性自证 3 危险 + 6 安全；台账棘轮（当前 0 项）。
          python tools/scan_narrow_deref.py --root . \
            --ledger tools/narrow_deref_pending.txt

      - name: 工作流续行链 lint（注释不得插进 `\` 续行链）★ 硬门禁
        run: |
          cd 1to1
          # 背景（第 44 轮实测事故，代价一整轮 CI）：场景 E 步骤曾在 `\` 续行链中间插了一行
          #   注释 ⇒ shell 把它与上一行合成一条命令、注释吃掉其后内容、且该行不以 `\` 结尾
          #   ⇒ **续行链断裂**，后面变成独立命令 ⇒ `CGM_KEY2_SEED`/`CGM_KEY2_HOOK`/`CGM_IO_TRACE`
          #   /`CGM_DBGUI2` **全部静默丢失**。观测现象：重建侧退回 `open … ui_cn.zip fail`
          #   （key2 未注入的原症状）、探针证据行消失，而**行为门禁反而报 PASS（假绿）**。
          # 本门禁把这类"实验条件被静默篡改"变成硬失败。构造性自证：1 坏样本 + 4 好样本。
          python tools/lint_workflow_continuation.py --root .

      - name: 调用点缺原型扫描（编译器真值）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-18 第 47 轮，真实缺陷，机器码级已定案）：
          #   `mui_outputxy_t`/`mui_outputxy_length` 调用 `stbtt_GetCodepointBitmapBoxSubpixel`
          #   等函数时 **proto.h 里没有原型** ⇒ C 的**隐式声明** ⇒ 实参按默认提升传：
          #     · `float` 变 **double**（机器码可见 `vcvt.f64.f32`）⇒ 进 d0/d1/d2；
          #     · 真函数按 `s0..s3` 读 ⇒ 整组错位；指针 `font` 排到第 5 位 ⇒ **r0 未设**；
          #     · 崩点 = `stbtt_FindGlyphIndex+0x8` 的 `ldr r4,[r0,#4]`，**故障地址 0x4**，
          #       lr = `stbtt_GetCodepointBitmapBoxSubpixel+0x2C` —— 与现场逐位吻合。
          # 口径：**用编译器真值**（逐文件 `-fsyntax-only`，缺原型以 error 形式出现），
          #   不用源码启发式（白名单维护不动、假阳性多）。
          # 自证：正向样本（未声明调用必须被检出）+ 负向样本（已声明调用必须不被检出）。
          # 台账棘轮：tools/implicit_decl_pending.txt（当前 0 项）—— 新增即失败。
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          [ -x "$ZIG" ] || { echo "::error::无法定位 zig"; exit 1; }
          python tools/scan_implicit_decl.py --root . --zig "$ZIG" \
            --ledger tools/implicit_decl_pending.txt

      - name: proto.h 声明 vs 上游真签名对拍★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-18 第 47 轮，与「缺原型」同族）：`src/compat/proto.h` 是我们**手写**的声明表，
          #   上游真签名在 `src/upstream/**` 头文件里。两者不一致时**编译器不报错**，但 ABI 会错位。
          #   实测：`extern float stbtt_ScaleForPixelHeight(float param_1, void *param_2);` —— 真签名是
          #   `(const stbtt_fontinfo *info, float height)`，顺序与类型都是反的。
          # 判据（对类型别名鲁棒）：**元数 + 每个参数的 float 位 + 返回值 float 性**（AAPCS 的浮点/整数
          #   分类才是 ABI 关键；`gh_u1` vs `unsigned char` 这种别名差异不参与比较）。
          # K&R 空参声明（`extern void f();`）不参与元数比较（C 里 = 参数不可知），由「调用点实参对拍」覆盖。
          # 自证：构造性样本（float 掩码互换必须被判定不一致）+ 状态感知（已修的 4 个 stbtt 必须不被报出）。
          # 台账棘轮：tools/proto_vs_upstream_pending.txt（当前 1 项 = UnzipItem，厂商扩展 API，见台账注释）。
          python tools/scan_proto_vs_upstream.py --root . \
            --ledger tools/proto_vs_upstream_pending.txt

      - name: shim 文案可 JSON 化检查 ★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-19 实测事故，代价：三个场景静默失效）：
          #   `behav_capture.sh` 把 guest 的 stdout/stderr 逐行收进 `behav_*.json`，
          #   而 JSON **不允许**裸控制字符（U+0000..U+001F，除 \t \n \r）。
          #   我写的 key2 探针文案里放了 `PK\x05\x06`（**真转义**）⇒ 输出带 ENQ/ACK
          #   ⇒ `behav_rebuild.json` 非法 ⇒ `behav_diff.py` 抛
          #   `JSONDecodeError: Invalid control character`，而 CI 仍报 success
          #   ⇒ **场景 B / E / F 三个全部静默失去判定**。
          # 判据：字符串字面量里「奇数个反斜杠 + xHH」才是真转义；
          #   `PK\\x05\\x06`（偶数）是字面文本，必须放行。构造性自证 1 坏 + 1 好。
          python tools/check_shim_charset.py --root .

      - name: 校验金标准完整性
        run: |
          python3 - <<'PY'
          import gzip, json
          d = json.load(gzip.open('1to1/golden/factory.funcs.json.gz', 'rt', encoding='utf-8'))
          f = d['functions']
          n = sum(x['n'] for x in f.values())
          print('golden functions=%d instructions=%d' % (len(f), n))
          assert len(f) == 835, 'golden 函数数异常（应 835）'
          assert n == 715473, 'golden 指令数异常（应 715473）'
          print('golden integrity OK')
          PY

      - name: 解压金标准
        run: gunzip -k -f 1to1/golden/factory.funcs.json.gz

      - name: 结构语义指纹门禁自检（期望 100% S1）
        run: |
          cd 1to1
          python3 tools/structsig.py golden/factory.funcs.json golden/factory.funcs.json

      - name: N3 ABI 门禁（验证可用工具链能产出工厂 ABI 的 ELF）
        run: |
          cd 1to1
          printf 'int main(void){return 0;}\n' > /tmp/tu.c
          arm-linux-gnueabihf-gcc -O2 -march=armv7-a -mfloat-abi=hard -mfpu=neon \
            -no-pie /tmp/tu.c -o /tmp/tu
          echo '--- 产出 ELF 规格 ---'
          readelf -h /tmp/tu | grep -E 'Type|Machine|Flags'
          echo '--- 对比原厂规格 ---'
          python3 tools/abi_check.py /tmp/tu

      - name: P2-A stb_truetype 版本指纹锁定
        run: |
          cd 1to1
          mkdir -p report
          CC=arm-linux-gnueabihf-gcc OBJDUMP=arm-linux-gnueabihf-objdump \
            python3 tools/ci_p2a_stb.py golden/factory.funcs.json.gz report/p2a_stb.txt
          echo '--- report ---'
          cat report/p2a_stb.txt

      - name: 类型可解析性自检（生成物健全性）
        run: |
          cd 1to1
          python3 tools/check_types.py

      - name: 数组名转型扫描（Ghidra 把 `arr[0]` 误渲染成 `(窄类型)arr`）★ 硬门禁
        run: |
          cd 1to1
          # ★ 血泪：工厂 `spi_driver_init` 的判断原指令是 `ldrb r3,[r6]`（r6=&spi_id），
          #   Ghidra 渲染成 `(gh_byte)spi_id` —— 在「spi_id 是数组」的声明下它变成
          #   **指针→字节转换**（取地址最低字节 0xc8，而真值是 0x0b）⇒ 判断走错分支
          #   ⇒ main() 不去 main_Menu()。编译/链接/ABI/布局全部是绿的，只有行为差分能发现。
          #   本步骤把该类误渲染变成**静态可拦**。
          python3 tools/scan_array_casts.py

      - name: .rodata 字符串当整数门禁（Ghidra 类型陷阱 ⇒ 多解引用一次）★ 硬门禁
        run: |
          cd 1to1
          # 血泪：工厂 0x002dcea4 处是字符串 "font.ttf"，Ghidra 渲染成 `undefined4`。
          #   若声明为 `unsigned int`，则 `(char *)DAT_002dcea4` 会多解引用一次
          #   （反汇编两条连续 ldr），把 "font" 的内容 0x746e6f66 当指针传出去
          #   ⇒ TUnzip::Find 里 strcpy 立刻 SIGSEGV。
          #   判据：整数声明 + 工厂该地址实为可打印字符串 + 被当 char* 用 ⇒ FAIL。
          python3 tools/scan_rodata_int_as_ptr.py

      - name: 重建编译门禁（双轨：宽松语法 + 严格类型，硬门禁假绿=0）
        run: |
          cd 1to1
          mkdir -p report
          sh tools/recon_build.sh report/recon_build.txt

      - name: P3 链接就绪审计（符号层：重复定义 / 未解析引用分类）★ 硬门禁
        run: |
          cd 1to1
          mkdir -p report
          rc=0
          PY=python3 sh tools/link_audit.sh report/link_audit.txt || rc=$?
          echo "link_audit 退出码 = $rc"
          echo '--- 审计要点 ---'
          grep -aE '重复定义|未解析引用|MISSING|upstream|结论' report/link_audit.txt | head -8
          # ★ 硬断言：重复定义 与 MISSING 必须为 0
          #   （此前本步骤带 continue-on-error: true，失败被静默掩盖 = 假绿）
          python3 - <<'PY'
          import re, sys
          t = open('report/link_audit.txt', encoding='utf-8', errors='replace').read()
          m = re.search(r'重复定义[^:：]*[:：]\s*(\d+)', t)
          assert m, '无法解析「重复定义」计数'
          dup = int(m.group(1))
          miss = len([l for l in open('report/_link_missing.txt', encoding='utf-8', errors='replace')
                      if l.startswith('MISSING')])
          print('硬断言：重复定义=%d  MISSING=%d' % (dup, miss))
          if dup != 0:
              print('::error::重复定义 != 0')
              sys.exit(1)
          if miss != 0:
              print('::error::MISSING != 0（未供应符号）')
              sys.exit(1)
          PY
          [ "$rc" = "0" ] || exit "$rc"

      - name: P3 上游组件编译（stb / mini-XML / Helix MP3 / GNU libiconv）
        run: |
          cd 1to1
          mkdir -p build/upstream
          PY=python3 sh tools/build_upstream.sh build/upstream

      - name: P3 完整链接 + ABI/布局门禁 ★ 硬门禁
        run: |
          cd 1to1
          # 注：数据镜像/链接脚本的「重新生成」需工厂 ELF，只在本地执行（tools/regen_data.sh）；
          #     CI 使用仓库内已提交的 src/data/factory_*.bin + factory_image.S + linker/factory.ld
          PY=python3 sh tools/link_full.sh build/rkgame.rebuilt.elf
          echo '--- 链接错误（应为空）---'
          wc -c report/link_full_err.txt
          echo '--- 布局门禁 ---'
          python3 tools/verify_layout.py build/rkgame.rebuilt.elf ledger/factory_globals.tsv
          echo '--- 动态段 / 初始化链自洽门禁 ---'
          # ★ 静态即可拦住「DT_INIT=0 → glibc call_init 调到地址 0 → SIGILL」这类致命 bug
          python3 tools/dyn_audit.py build/rkgame.rebuilt.elf
          echo '--- ABI 门禁 ---'
          python3 tools/abi_check.py build/rkgame.rebuilt.elf

      - name: 上游符号指纹门禁（技能铁律 90：库名对 ≠ 版本对）
        run: |
          cd 1to1
          # 血泪：项目长期记录「XUnzip = Wischik zip_utils」——**名字对、版本错**。
          #   工厂 TUnzip::Unzip 仅 28 B(+.part.7 488 B)、我们 1608 B；unzOpenCurrentFile
          #   工厂单参数、我们双参数；工厂 TUnzip::Open 84 B 且无 GetCurrentDirectory。
          #   ⇒ 行为分歧：工厂优雅打印 `open %s fail`，我们继续走到 unzOpenCurrentFile 崩溃。
          #   判据：同源码不同编译器的 size 差通常 < 2×；≥8× 基本是版本/实现不符。
          #   已知未对齐项登记在 tools/upstream_fingerprint_baseline.txt（修好一项须删一行）。
          python3 tools/scan_upstream_fingerprint.py

      - name: C++ mangled 签名对拍（Itanium ABI）★ 硬门禁
        run: |
          cd 1to1
          # 背景（第 45 轮实测）：`TUnzip::Find` / `unzOpenCurrentFile` 这类 **C++ 包装层**
          #   此前只有"函数尺寸比"这一弱指标，而尺寸差多数来自"内联 vs 外调"（铁律 112）
          #   ⇒ 真实签名差异只能靠人肉 diff 发现。实测抓到两处：
          #     · 工厂 `_Z18unzOpenCurrentFileP5unz_s`（单参） vs 我们 `..._sPKc`（双参）
          #     · 我们 `TUnzip::Find` 多一个 264 B 栈缓冲 + `strcpy`（工厂直接透传 tname）
          #   而**参数的个数与类型全部编码在 mangled 名里** ⇒ 可机械对拍，且与编译器无关。
          # 判据：按名字部分配对，比较参数编码集合；后缀 `.isra/.part/.constprop/.llvm` 先归一。
          # 自证：3 条正向锚点（状态感知打印）+ 1 条归一化锚点（`.part.N` 必须被剥离）。
          # 台账棘轮：签名不一致 + 「我们独有」两类，均只许缩小。
          python tools/scan_cxx_abi.py             --factory golden/factory.rkgame.bin --ours build/rkgame.rebuilt.elf             --ledger tools/cxx_abi_pending.txt

      - name: 上游库公有 API 集合对拍（版本钉错检出）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-18 实测）：上游库**版本钉错**不会让任何编译/链接门禁报错，只会静默改行为。
          #   机械证据：我们的 stb_truetype 里存在 `stbtt_FindSVGDoc`/`stbtt_GetCodepointSVG`/
          #   `stbtt_GetGlyphSVG`（**SVG 支持自 v1.22 才引入**）与 `stbtt_GetKerningTable*`，
          #   而工厂二进制**没有**这些符号；同类还有 mini-XML 6 个、Helix MP3 2 个 ⇒ 共 14 项。
          #   判别"是版本旧还是被 --gc-sections 裁剪"的依据：工厂**保留了同样没被游戏使用的**
          #   `stbtt_PackFontRanges*` 等公有 API ⇒ 没做裁剪 ⇒ 确系版本更旧。
          # 判据：只看上游库公有 API（过滤 isra/part 内联重命名）；"我们多出"入台账棘轮，**新增即失败**。
          python tools/scan_symbol_delta.py --ours build/rkgame.rebuilt.elf \
            --pending tools/upstream_api_pending.txt

      - name: 调用点实参寄存器对拍（工厂=对照组）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-17 实测）：ARM 上"调用点少设一个实参寄存器"= 传寄存器垃圾。
          #   已实证：`stbtt_GetFontVMetrics(font,&fontascent,0)` —— 原厂源码同为 3 参，
          #   但 GCC 6.2.0 构造 r2=0 时顺带 `mov r3,#0`（**恰好安全**），
          #   我们用 clang 直接 `mov r2,#0` ⇒ r3 任意 ⇒ 函数体 `if (lineGap) *lineGap=...`
          #   变成**野写**。这类"依赖寄存器副产物的脆弱性"是 1:1 替代必须显式化的东西。
          # 判据：逐 (调用者,被调者) 对拍两侧的"实参寄存器设置集合"，取交集后比差。
          # 自证三级：① 同 ELF 对拍必须 0；② 人工核对过的锚点必须被量到；
          #          ③ 锚点必须出现在**最终违例表**中（端到端）。
          # 台账棘轮：已知项入 tools/livein_args_pending.txt；**新增即失败**。
          python tools/scan_livein_args.py \
            --factory golden/factory.rkgame.bin --ours build/rkgame.rebuilt.elf \
            --ledger tools/livein_args_pending.txt

      - name: 逐函数「调用点个数」对拍（源码级，与 codegen 无关）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-17 实测）：场景 E 的执行集合差集里发现
          #   `mui_setting -> mui_outputxy_t` 的**二进制 bl 数 工厂 13 / 我们 8**，
          #   一度以为"漏了 5 次字符串绘制调用"。核查结论：
          #     · 源码级（Ghidra per-function C vs src/proprietary）：**13 / 13 一致**
          #     · 二进制层差异来自 clang 的 **cross-jumping**（把工厂两处调用
          #       `sub r2,#10` / `sub r2,#6` 用 `mvn r7,#9` + `mvneq r7,#5` 合并成一处）
          #   ⇒ **二进制层的调用点计数不是保真度指标**；本门禁改用**源码级调用表达式计数**，
          #     这是目前**唯一**能抓到"我们漏了一次调用"这类缺陷的机械检查。
          # 自证：正向锚点 2 条（人工逐行核对）+ 负向锚点 4 条（证明 mangled 名归一化生效）。
          # 台账棘轮：tools/call_counts_pending.txt（当前 0 项）—— 新增即失败。
          python tools/scan_call_counts.py --root . \
            --ledger tools/call_counts_pending.txt

      - name: 变参函数保真度门禁（Ghidra 会把 `f(char*, ...)` 渲染成单参数）
        run: |
          cd 1to1
          # 血泪：RARCH_LOG 丢了 `...` ⇒ RARCH_LOG_V 的 va_list 取到调用者的 r1 残留
          #   ⇒ vfprintf 把字符串自己的内存当参数列表 ⇒ 崩在 libc strlen（观测窗口停在 18/32）。
          #   工厂侧特征：`push {r0,r1,r2,r3}`（全 .text 仅 4 处）；重建侧 LLVM 用 `stm rX,{r1,r2,r3}`。
          FACTORY_ELF=golden/factory.rkgame.bin python3 tools/scan_varargs_fns.py

      - name: 刻度 A（源码级工厂依赖）普查 ★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-23）：`fidelity_audit.py` 的**二进制口径**（扫 .text 里落在
          #   `.fimg_*` 区间的 4 字节值）已被证明不可用：它报 10007，而真值是**源码里
          #   对工厂符号的引用数**。改用本工具：符号清单以**链接产物 ELF 的 .fimg_* 段符号**
          #   为准（权威，自带段归属），引用点从 src/ 源码统计，并显式排除
          #   globals.h（声明表）与 factory_image.S（定义）。
          # 本步骤同时跑正反双向自证（注释/字符串/假名/排除规则四个反例态）。
          python3 tools/fidelity_source_deps.py --self-test

      - name: DCE 引用差门禁（工厂数据引用被 -Os 消除）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-23，GAP 16.99）：Ghidra 会把工厂栈上**一个连续缓冲**按类型拆成
          #   若干独立局部量，原指令却用 `p = &local_150; p = p + 1` **跨对象步进** ——
          #   这在 C 里是**未定义行为**，GCC/clang 据此把后续槽的写入**整体删除**。
          #   实测 `core/FUN_002b6c14_FBA_Load.c`：-O0 有 11 个工厂数据引用、-Os 只剩 2 个
          #   ⇒ 原厂「10 条候选 core 路径」的链退化成 1 条。产物照样能链接、能启动，
          #   **任何静态门禁都不报**（符号只是"少了一个"，不是"未定义"）。
          # 判据：对同一 .c 只改优化级别编译两次，Δ = UNDEF(-O0) 减去 UNDEF(-Os) 的 DAT_/UNK_。
          #   台账棘轮：存量登记在工具内 ALLOW（必须缩小），**表外新增即失败**。
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          CC="$ZIG cc" python3 tools/dce_ref_diff.py --out report/dce_ref_diff.txt

      - name: 数据模块「重生成契约」门禁 ★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-23）：`tools/regen_data.sh` 会**重写**已提交的 linker/factory.ld
          #   与 src/data/factory_image.S，而这两份文件含**多次手工修复**；生成器一旦没跟上，
          #   每跑一次 regen 就**静默回退一次**（实测：regen 后 .ld 少了 GAP 16.69/16.71 的修复，
          #   把 .data/.bss/.text 又钉回 0x01000000/0x02000000/0x05000000 ⇒ 真机 exec 零日志）。
          # 本步骤断言不变量：① 无钉死运行时地址；② RELRO 族独立且排在 .data 之前、.data 页对齐；
          #   ③ 别名数棘轮（防「用 MISSING 而不是全量 UNDEF 重生成」导致 934→17 塌缩）；
          #   ④ 文本产物纯 LF；⑤ 关键小段存在。
          python3 tools/check_regen_contract.py --self-test

      - name: 转写完整性门禁（我们的源码 vs Ghidra 逐函数原始 C）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-24，第 58 轮）：`prop_equiv` 用**体量比**判等价，但它分不清两件事：
          #   (a) **codegen 差异**（同一份 C，clang/zig -Os 与工厂 GCC 6.2 -Os 本就不同；
          #       而且我们的 C 是 Ghidra **抽象后**的渲染，常更"干净" ⇒ 编出来更短）；
          #   (b) **转写缺失**（把 Ghidra 的 C 抄进 src/proprietary 时漏了语句）。
          #   ⇒ 体量偏小时两者都会触发，不能只凭它下结论。
          # 本门禁用**权威对照**（02-ghidra-c/03-per-function）在**源码级**判：
          #   重建契约 = 「我们的文件 = Ghidra 的文件 + 注入的 include/头注释」，
          #   所以**调用总数不得少于 Ghidra**（少了 = 调用消失 = 真漏语句 ⇒ FAIL）。
          # ★ 判据收紧过一次：首版拿"调用**名集合**不同"当 FAIL，全量跑出 5 个假阳性
          #   （OpenZipU G5/O5、GetZipItemA G2/O2…—— **总数完全相同**，只是 C++ 成员函数
          #   / `new`/`delete` 的写法改名）⇒ 收紧为「**总数变少**才 FAIL」，名不同归 INFO。
          #   语句数（`;` 计数）偏少只进"待核"清单（宏/多语句行/声明合并会干扰）。
          python tools/src_transcript_parity.py

      - name: 函数组归一化口径自证（修 prop_equiv 的克隆后缀配对）★ 硬门禁
        run: |
          cd 1to1
          # 背景（2026-09-24）：我们的 C **标识符不能带点** ⇒ 转录工厂的
          #   `code_convert.constprop.22` 时函数名写成 `code_convert_constprop_22`（点→下划线）。
          #   旧 `norm_name` 只剥**点号**形式 ⇒ 两侧永远配不上 ⇒ 被**误报 MISSING**（实测 2 个）。
          # 本步骤自证归一化规则（8 条正反例，含"不该误伤 `foo_part_bar`"），
          # 并按**归一化组求和**对拍体量（与 prop_equiv 的"单代表"口径互补）：
          #   实测 `run_process` / `GetZipItemA` 在组求和后**转 OK** ⇒ 那两条原先确是口径伪影。
          python tools/equiv_group_sum.py --self-test

      - name: 门禁汇总（写入 Job Summary）
        if: always()
        run: |
          cd 1to1
          {
            echo '## 1to1 门禁汇总'
            echo
            echo '```'
            grep -aE '语法通过率|类型正确率|假绿' report/recon_build.txt 2>/dev/null | head -4
            echo
            grep -aE '重复定义|未解析引用|MISSING|upstream|结论' report/link_audit.txt 2>/dev/null | head -8
            echo
            grep -aE '全局符号命中率|局部符号命中率|受检符号|越界符号|结论' report/verify_layout.txt 2>/dev/null
            echo
            echo "link_full_err 字节数: $(wc -c < report/link_full_err.txt 2>/dev/null || echo n/a)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1to1-p2a-report
          path: 1to1/report/
          if-no-files-found: warn
