name: 1to1-qemu-behav

# ============================================================
# P5 行为差分门禁（独立 workflow）
#
# 为什么不并入 1to1-verify：
#   · 1to1-verify 是「静态门禁」（编译 / 链接 / 布局 / ABI），状态应当是稳定可绿的；
#   · 本 workflow 是「动态门禁」，需要 qemu + armhf sysroot + 运行期驱动，
#     在把被测程序真正驱动起来之前它会**持续红**。
#   把两者分开，才能保证「绿」始终等于「真的绿」——而不是靠 continue-on-error 掩盖。
#   ★ 纪律：**门禁步骤**一律不得带 `continue-on-error`（`1to1-verify` 有机械 lint 把关）；
#     **观测步骤**（尚在建立基线、只为拿数据的场景）必须显式标注"观测非门禁"并写明
#     "基线稳定后必须去掉 `|| true` 升级为硬门禁"，否则等于白测。
#     INCONCLUSIVE(3) 在任何情况下都判失败。
#
# 环境选型依据（见 tools/ci_qemu_env.sh 顶部注释）：
#   sysroot 必须是 Ubuntu 22.04 armhf —— 与 CI 工具链同版本 glibc(2.35)，
#   否则重建产物会 `version GLIBC_2.35 not found`。工厂 rkgame 只要 ≥2.7，向下兼容。
# ============================================================

on:
  workflow_dispatch:
  push:
    paths:
      - '1to1/**'
      # ★★ 2026-09-20：**排除纯文档**。本 workflow 一轮要 8~12 分钟（qemu + 9 场景 + 3 道探针），
      #   而 `1to1/**` 把 `GAP.md`/`STATUS.md`/逐日日志也算进来 ⇒ 仅改文档也触发整轮重跑，
      #   实测白烧一轮 Actions 预算。GitHub 允许在 `paths` 里用 `!` 做否定（顺序敏感：否定在后）。
      #   ★ 纪律：**代码改动与文档改动一起推**（文档单独推不会再触发 CI，但在"只有文档"时
      #     本轮就没有可验证的信息增量 —— 所以要么合并推、要么明确知道它不会跑）。
      - '!1to1/*.md'
      - '.github/workflows/1to1-qemu-behav.yml'

permissions:
  contents: read

jobs:
  qemu-behav:
    name: P5 qemu 行为差分（factory vs rebuild）
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ARM 交叉工具链
        run: |
          sudo apt-get update -qq
          # gdb-multiarch：用于回溯探针（取真实崩溃点与调用栈）
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf strace gdb-multiarch
          arm-linux-gnueabihf-gcc --version | head -1

      - name: 安装 zig（与本地同一工具链 ⇒ 重建产物的 GLIBC 下限可控）
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ziglang==0.16.0
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          chmod +x "$ZIG"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          echo "CC=$ZIG cc" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zigcache" >> "$GITHUB_ENV"
          "$ZIG" version

      - name: 建立 qemu-user + armhf sysroot
        run: sudo -E sh 1to1/tools/ci_qemu_env.sh /arm-root

      # ★★ 设备真实 sysroot（`/arm-root-device`，glibc 2.29 Buildroot）
      #   为什么必须有它：`/arm-root`（Ubuntu 22.04，glibc 2.35）与设备**执行路径实质不同**
      #   （实测：同一份 rebuilt.elf 换 sysroot 后到得了的里程碑完全不一样，见 GAP 16.21 F 节）。
      #   ⇒ **交付判据必须用 device 口径**；jammy 只用于"与 CI 历史数字对齐"。
      #   零成本：资产已在仓库里（`1to1/golden/device_rootfs_min/`，13 文件 / 3.82 MB），只需 cp。
      - name: 建立**设备真实** sysroot /arm-root-device
        run: |
          sudo rm -rf /arm-root-device
          sudo mkdir -p /arm-root-device
          sudo cp -a 1to1/golden/device_rootfs_min/. /arm-root-device/
          sudo rm -f /arm-root-device/MANIFEST.sha256
          echo "文件数 = $(sudo find /arm-root-device -type f | wc -l)"
          echo "ld.so  = $(sudo test -f /arm-root-device/lib/ld-linux-armhf.so.3 && echo OK || echo 缺)"
          echo "libc   = $(sudo test -f /arm-root-device/lib/libc.so.6 && echo OK || echo 缺)"
          strings /arm-root-device/lib/libc-2.29.so 2>/dev/null | grep -m1 'GNU C Library' || true

      - name: 准备真机同款工作目录 /sdcard/cubegm
        run: |
          sudo mkdir -p /sdcard/cubegm/saves /sdcard/cubegm/states
          sudo chown -R "$USER" /sdcard
          ls -la /sdcard/cubegm

      - name: 构建 1:1 重建产物（含 build/obj 对象）
        run: |
          cd 1to1
          mkdir -p report
          # link_audit.sh 是本仓库里唯一会把 src/proprietary/*.c 编译成 build/obj/*.o 的脚本；
          # 它自身的门禁结论由 1to1-verify 负责，这里只为拿对象，故 rc 不强判。
          PY=python3 sh tools/link_audit.sh report/link_audit.txt || \
            echo "[warn] link_audit 非零（对象已产出，继续）: rc=$?"
          PY=python3 sh tools/build_upstream.sh build/upstream
          PY=python3 sh tools/link_full.sh build/rkgame.rebuilt.elf
          echo '--- 动态段 / 初始化链自洽门禁（跑起来之前先静态拦一遍）---'
          python3 tools/dyn_audit.py build/rkgame.rebuilt.elf
          echo '--- 被测二进制 ---'
          ls -la build/rkgame.rebuilt.elf golden/factory.rkgame.bin

      - name: 行为采集 + 差分 ★ 硬门禁
        run: |
          cd 1to1
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=20 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu

      # ★★ 场景 B：注入厂商 ZIP 签名表（key2@0x3E190C）⇒ 资源包**可打开** ⇒ 首次进入菜单正文。
      #   为什么必须有它：场景 A 里两侧都停在 `open .../ui_cn.zip fail` ⇒ `mui_setting` NULL+4 崩，
      #   于是 mui 模块（42 函数 / 70,396 B = 重构量的 57%）**永远跑不到**，覆盖率天花板 25%。
      #   ★ 本步骤是**观测（非门禁）**：场景 B 尚在建立基线期（首跑可能仍两侧同崩或立刻暴露新分歧），
      #     故用 `|| true` 只为拿数据。**基线稳定后必须去掉 `|| true` 升级为硬门禁**（否则等于白测）。
      - name: 行为采集·场景 C（补 libkms 桩解锁 driver.so，观测非门禁）
        continue-on-error: true
        run: |
          cd 1to1
          mkdir -p report/stublib
          sh tools/build_libkms_stub.sh report/stublib || echo "[warn] 桩构建失败，场景 C 退化为场景 A"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=25 CGM_COV_TAG=C CGM_LIBKMS_STUB=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_c || true
          echo '--- 场景 C：driver.so 是否已加载（stdout 不应再出现 libkms 报错）---'
          grep -a "driver.so" report/qemu_c/rundir_factory/stdout.txt \
                            report/qemu_c/rundir_rebuild/stdout.txt \
            || echo "(两侧均无 driver.so 报错行 ⇒ 已成功加载)"
          echo '--- 场景 C 覆盖率 ---'
          sed -n '1,9p' report/qemu_c/coverage_rebuild.txt 2>/dev/null || true

      # ★★★ 场景 C4：**设备真机 sysroot** + `libkms`/`libdrm`/`libasound` 三桩（观测非门禁）
      #   为什么它是本项目最关键的一个场景：**这是设备上真实会走的路径**。
      #     · 设备 rootfs 里**有** libkms.so.1 ⇒ `dlopen(driver.so)` 成功 ⇒ 进厂商 driver.so；
      #       而 jammy sysroot 恰好缺 libkms ⇒ 历史 48/68/76 覆盖率全是"driver.so 没加载"才走到的，
      #       **那不是真机路径**（见 GAP 16.21 H 节）。
      #     · 沙箱无真 DRM/声卡 ⇒ 真 libdrm/libasound 的调用全失败 ⇒ 厂商代码拿 NULL 必崩
      #       （实测 gdb：`driver.so+0x3ca8` 的 `gr_init`，`ldr r3,[r3]` 且 r0..r3=0）。
      #     · 三桩把 driver.so 的图形+音频后端都"做成成功" ⇒ 执行流第一次能穿过 driver.so
      #       进入 rkgame 菜单正文。证据链：GAP 16.22（libdrm 桩，M0–M7 全通）/ 16.23（libasound 桩）。
      #   ★ 与场景 C 严格对照：唯一变量 = `SYSROOT` 取值 + 桩集合。
      #   ★ 三桩都是**显式开关**且由本场景自己打开 ⇒ 不会泄漏到 A/B/C/D 等其它场景。
      - name: 行为采集·场景 C4（设备真机 sysroot + 三桩；观测非门禁）
        continue-on-error: true
        run: |
          cd 1to1
          mkdir -p report/stublib report/drmstublib report/alsastublib
          sh tools/build_libkms_stub.sh    report/stublib     || echo "[warn] libkms 桩构建失败"
          sh tools/build_libdrm_stub.sh    report/drmstublib  || echo "[warn] libdrm 桩构建失败"
          sh tools/build_libasound_stub.sh report/alsastublib || echo "[warn] libasound 桩构建失败"
          echo '--- 三桩自证（SONAME 必须与 driver.so 的 DT_NEEDED 一致；UND 必须为 0）---'
          for f in report/stublib/libkms.so.1 report/drmstublib/libdrm.so.2 report/alsastublib/libasound.so.2; do
            [ -f "$f" ] || { echo "  ★ 缺 $f"; continue; }
            printf '  %-20s SONAME=%-18s UND=%s\n' "$(basename "$f")" \
              "$(arm-linux-gnueabihf-readelf -d "$f" 2>/dev/null | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p' | head -1)" \
              "$(arm-linux-gnueabihf-readelf -sW "$f" 2>/dev/null | awk '$7=="UND" && $8!=""' | wc -l)"
          done
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_COV_TAG=C4 \
            CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 \
            sh tools/ci_qemu_behav.sh build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_c4 || true
          echo '--- 场景 C4：里程碑（M0–M7 是否全通）---'
          cat report/qemu_c4/milestones.txt 2>/dev/null || true
          echo '--- 场景 C4：两侧覆盖率 ---'
          for s in factory rebuild; do printf '%-8s ' "$s"; grep -aE "已执行" report/qemu_c4/coverage_$s.txt 2>/dev/null | head -1; done
          echo '--- 场景 C4：终止码（两侧应一致；不一致本身就是判决性证据）---'
          for s in factory rebuild control; do printf '%-8s ' "$s"; grep -ahoE "exit=[0-9]+" report/qemu_c4/milestones.txt 2>/dev/null | head -1; done
          echo '--- 场景 C4：崩溃/断言行（下一个瓶颈就在这几行里）---'
          grep -ahE "Assertion|assert|真崩溃|abort" \
            report/qemu_c4/rundir_*/stderr.txt report/qemu_c4/rundir_*/stdout.txt 2>/dev/null \
            | sort -u | head -8 || true

      # ★★★ 场景 C5：C4 + **完整 J 口径旁路注入** ⇒ 与本地 CNB 的 `dv_y` **逐字同口径**。
      #   为什么必须有它（2026-09-19 实测教训）：
      #     C4 不含 `CGM_KEY2_SEED` ⇒ `ui_cn.zip` 打不开 ⇒ M6 必然 ✗（实测 CI/C4 = M6✗, 覆盖率 50/48）
      #     ⇒ 它只能测"桩链本身通不通"，**测不到"桩把执行流推到了多深"**。
      #   ★ 它要验证的结论：设备真机路径 + 三桩 + J 口径下
      #     **rebuild 覆盖率 = 73/223（52→73，+40%），终止码 124（超时存活）而非 139（崩）**。
      #   ★ 该比值已在本地 CNB 容器（Debian 13）测出；本场景负责给出**跨平台可复现**的外部证据。
      - name: 行为采集·场景 C5（C4 + J 口径旁路注入；与本地 dv_y 同口径；观测非门禁）
        continue-on-error: true
        run: |
          cd 1to1
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_COV_TAG=C5 \
            CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 \
            CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 \
            CGM_EXEC_ALIGN=1 \
            CGM_TRACE_ADDRS="00010fec 00011064 00010ff8 00010ed8 0001168c 000110d4 0001162c 00011868 0001190c 00011074 00010ea0 00012608 000128dc 00012cd0 00012ebc 00017e9c 00017eb4 00017e48" \
            sh tools/ci_qemu_behav.sh build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_c5 || true
          # ★★★ 关键地址命中普查的**地址清单与含义**（2026-09-21）——为什么要它：
          #   已知链：C5 里两侧都能**打开** ui_cn.zip（没打 `open ... fail`），但**工厂"找不到"
          #   包内确实存在的条目**（打了 `find ui.cfg/… fail`），我们找到了。
          #   而 OpenZipU 成功 ⇔ unzOpenInternal 非 NULL ⇔ EOCD 搜索 + 中央目录解析都成功
          #   ⇒ 失败点只可能在「逐条读中央目录项的**文件名**并比对」这一段。
          #   下面 18 个地址就是这条链上的**每一个判决点**（工厂侧绝对地址，取自 factory symtab）：
          #     010fec  SearchCentralDir：**命中**（算出了 EOCD 位置）
          #     011064  SearchCentralDir：**短读 ⇒ 返回 0**（lufread != 1）
          #     010ff8  SearchCentralDir：循环结束仍未找到 / malloc 失败 ⇒ 返回 0
          #     010ed8  SearchCentralDir：入口 seek 失败 ⇒ 返回 0
          #     01168c  unzOpenInternal 入口
          #     011074  unzGetGlobalInfo 入口（unzLocateFile 循环前先取 number_entry）
          #     01162c  unzGoToFirstFile 入口
          #     011868  unzGoToNextFile 入口（**命中次数 = 循环迭代了几次**）
          #     0110d4  unzlocal_GetCurrentFileInfoInternal 入口（每次读一条中央目录项）
          #     01190c  unzLocateFile 入口
          #     010ea0  unzStringFileNameCompare 入口（大小写不敏感比对，仅 16 B）
          #     012608  TUnzip::Open 入口      0128dc  TUnzip::Find 入口
          #     012cd0  OpenZipU 入口          012ebc  FindZipItemA 入口
          #     017e9c  mui_LoadUIResource：`FindZipItemA != 0` ⇒ **"找不到条目"**
          #     017eb4  mui_LoadUIResource：`OpenZipU == 0` ⇒ "打不开"
          #     017e48  mui_LoadUIResource：**成功**路径
          #   ★ 读法：**先看 010fec 与 011064 哪个非零** —— 直接区分"EOCD 没搜到"与"搜到了但条目比对失败"；
          #     再看 0110d4 / 011868 次数：若各约 6~7 次，说明循环确实遍历了全部 6 个条目而名字没匹配上
          #     （⇒ 问题在**文件名字段读取**或**比对函数**），而不是"没进循环"。
          #   ★ 这些是**工厂侧**地址：rebuild/control 列接近 0 属正常（布局不同），只有 factory 列可读。
          #   ⚠️⚠️ **地址必须是 8 位十六进制**（轨迹里的 PC 字段是 `%08x`）：
          #     写成 6 位 `010fec` ⇒ `grep "/010fec/"` 与 `/00010fec/` 不相等 ⇒ **恒 0 命中**，
          #     而"0 命中"看起来恰好等于"这条分支没走到" ⇒ 结论会被带向**相反**方向。
          #     纪律：一律 `'%08x' % addr`；并先用一个**必然命中**的地址（如 main 入口）自检链路。
          echo '--- 场景 C5：里程碑（rebuild 应 M6 ✓ / M7 ✓）---'
          cat report/qemu_c5/milestones.txt 2>/dev/null || true
          echo '--- 场景 C5：★ 执行轨迹对齐（首个分歧点；Laelaps 法）---'
          sed -n '1,40p' report/qemu_c5/exec_align.txt 2>/dev/null || echo '   （无 exec_align.txt）'
          echo '--- 场景 C5：★★ zip 路径关键地址命中普查（factory 列可读；其余列地址不同，接近 0 正常）---'
          for s in factory rebuild control; do
            echo "   [${s}]"
            cat report/qemu_c5/trace_hits_${s}.txt 2>/dev/null | sed 's/^/      /' || echo "      （无）"
          done
          echo '--- 场景 C5：★★ zip 路径关键地址命中普查（factory 列可读；其余列地址不同，接近 0 正常）---'
          for s in factory rebuild control; do
            echo "   [${s}]"
            cat report/qemu_c5/trace_hits_${s}.txt 2>/dev/null | sed 's/^/      /' || echo "      （无）"
          done
          echo '--- 场景 C5：两侧覆盖率（★ 期望 rebuild = 73/223 = 32.74%，本地已测）---'
          for s in factory rebuild control; do printf '%-8s ' "$s"; grep -aE "已执行" report/qemu_c5/coverage_$s.txt 2>/dev/null | head -1; done
          echo '--- 场景 C5：stdout 行数（rebuild 应远超 factory ⇒ 菜单真在跑，不是"没崩但没干活"）---'
          for s in factory rebuild control; do printf '%-8s ' "$s"; wc -l < report/qemu_c5/rundir_$s/stdout.txt 2>/dev/null || echo '(无)'; done
          echo '--- 场景 C5：终止码（★ rebuild 期望 124=超时存活；factory 139=崩）---'
          grep -ahoE "exit=[0-9]+" report/qemu_c5/milestones.txt 2>/dev/null | sort | uniq -c || true
          echo '--- 场景 C5：差分方向（工具应自判"哪一侧更健康"）---'
          grep -aE "门禁结果|方向|疑似" report/qemu_c5/behav_diff.txt 2>/dev/null | head -4 || true

      # ★★★ 格式一致性硬断言（2026-09-20，GAP 16.30）——**为什么必须是独立硬门禁**：
      #   桩 libdrm 的 `CREATE_DUMB` 曾把 width/height/bpp 写死（pitch 恒 = 1280*4、且先 zfill 再读输入），
      #   ⇒ driver.so 的 dumb buffer 全被伪造成 32bpp，而 rkgame 侧 `frame->[12] = colormode = 2`（16bpp）
      #   ⇒ `gr_blit_b` 判定恒不等 ⇒ 30 s 内刷 **1816 次**同一句 `gr_blit: source has wrong format`
      #   ⇒ rebuild 表面"活着（exit=124）"，实际**一帧都没画出去**（忙循环）。
      #   ★ 这条回归**覆盖率抓不到**：`gr_blit_b` 本来就在执行，只是每次都提前 return；
      #     `qemu_coverage.py` 按**函数**计数 ⇒ 73/223 一动不动。
      #   ⇒ 必须有一条**语义判据**：wrong-format 计数 **必须为 0**。
      - name: ★ 格式一致性硬断言（C5 的 wrong-format 计数必须为 0）
        run: |
          cd 1to1
          f=report/qemu_c5/rundir_rebuild/stdout.txt
          if [ ! -f "$f" ]; then
            echo "::error::缺少 $f（C5 未产出 rebuild stdout ⇒ 仪器故障，判定不存在）"
            exit 1
          fi
          n=$(grep -ac 'gr_blit: source has wrong format' "$f" || true)
          n=${n:-0}
          echo "重建侧 gr_blit wrong-format 计数 = $n（期望 0）"
          total=$(wc -l < "$f" 2>/dev/null | tr -d ' ')
          echo "重建侧 stdout 总行数 = ${total:-?}"
          if [ "$n" != "0" ]; then
            echo "::error::rebuild 侧出现 $n 次 'gr_blit: source has wrong format' ⇒ 帧格式又对不上了（回归）"
            echo "        最后 3 条现场："
            grep -a 'wrong format' "$f" | tail -3
            exit 1
          fi

      - name: 行为采集·场景 J（起始屏幕=0 + 合成 root.dat；M/N/O/P 的对照基线）
        run: |
          cd 1to1
          # ★★ 2026-09-20（GAP 16.30 ⑨）：J/M/N/O/P **重挂到「设备真机 sysroot + 三桩」深口径**。
          #   为什么必须改：这五个场景原先跑的是**默认口径**（jammy sysroot + 不带桩）⇒
          #   设备 rootfs 里**有** libkms.so.1 而 jammy 没有 ⇒ `dlopen(driver.so)` 失败 ⇒ M3 ✗
          #   ⇒ 它们**从来没走到菜单渲染** ⇒ "列表是否被填充""菜单是否被驱动"这些
          #   **它们本来就要回答的问题，一条也没被回答过**（观测项在观测一个不存在的路径）。
          #   ★ 历史数字属"浅口径基线"，与深口径**不可直接比较**（口径变了 ⇒ 不是单变量）。
          mkdir -p report/stublib report/drmstublib report/alsastublib
          sh tools/build_libkms_stub.sh    report/stublib     || echo "[warn] libkms 桩构建失败"
          sh tools/build_libdrm_stub.sh    report/drmstublib  || echo "[warn] libdrm 桩构建失败"
          sh tools/build_libasound_stub.sh report/alsastublib || echo "[warn] libasound 桩构建失败"
          for _f in report/stublib/libkms.so.1 report/drmstublib/libdrm.so.2 report/alsastublib/libasound.so.2; do
            [ -f "$_f" ] || { echo "::error::缺 $_f ⇒ 深口径无法建立（仪器故障，本场景判定不存在）"; exit 1; }
          done
          # 背景（第 49 轮）：场景 I 补了 root.dat 后覆盖 59→76（首次超过 68）且 M7 复现，
          #   但出现 `open /sdcard//.dat fail` 反复刷屏 ⇒ fileinfo.txt 的内容不对。
          #   真值源（mui_do_file_list 的解析循环）：分隔符 = " , ; 换行 回车 "，
          #   每项经 mui_extract_basepath 后**被 strtol(...,10) 当十进制数**
          #   ⇒ 每项必须是 NNN/文件名 形态；场景 I 用的 golden/fileinfo 是单个 0，
          #   没有斜杠 ⇒ basepath 为空 ⇒ /sdcard//.dat。
          #   而 cores/filelist.xml 的 name="002/xxx.zip" 正是该形态 ⇒ 用它当 fileinfo.txt。
          # 本场景只改 fileinfo.txt 的来源（CGM_ROOTDAT 1→2），其余与 I 完全一致。
          export CGM_STAGE_EVIDENCE="report/qemu_j/stage_evidence.txt"
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=J CGM_EXEC_ALIGN=1  \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_j || true
          echo "--- 场景 J：root.dat 注入证据（应含 mode=filelist）---"
          grep -a ROOTDAT report/qemu_j/stage_evidence.txt 2>/dev/null | head -8 || echo "   （无）"
          echo "--- 场景 J：/sdcard//.dat 失败行数（对比 I，期望显著下降）---"
          for d in qemu_j qemu_m; do
            printf "   %s : %s 行\n" "$d" "$(grep -ac "/.dat fail" report/$d/rundir_rebuild/stdout.txt 2>/dev/null)"
          done
          echo "--- 场景 J：里程碑 / 覆盖率（对比 I）---"
          sed -n "/ID     里程碑/,/MX/p" report/qemu_j/milestones.txt 2>/dev/null || true
          grep -aE "已执行|覆盖函数|覆盖字节" report/qemu_j/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 J vs I：新增执行的专有函数 ---"
          python tools/exec_set_diff.py --factory report/qemu/coverage_rebuild.txt \
            --ours report/qemu_j/coverage_rebuild.txt --label a_vs_j \
            --out report/qemu_j/a_vs_j.txt || true
          sed -n "1,26p" report/qemu_j/a_vs_j.txt 2>/dev/null || true
      - name: 行为采集·场景 M（ui.cfg 补 GameList_count ⇒ 打开列表闸门；与 J 严格单变量）
        run: |
          cd 1to1
          # 闸门：DAT_003af394（每屏列表项数）= **所有列表循环的统一上界**
          #   （mui_do_file_list.c:68 / dir_serial_list.c:82 / mui_menu / mui_type / DisplayPage_list）；
          #   来源 = mui_LoadConfig: get_value_from_items("GameList_count")，configitems 取自
          #   ui_cn.zip 的 ui.cfg —— 而 golden 的 ui.cfg（242 B）没有这个键。
          # 本场景只补这一个键（值 11 = 程序内置默认，不编造数值）⇒ 与 J 严格单变量。
          export CGM_STAGE_EVIDENCE="report/qemu_m/stage_evidence.txt"
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 CGM_UICFG=1 \
            CGM_IO_TRACE=1 CGM_COV_TAG=M \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_m || true
          echo "--- M：★ 闸门值（DBGCFG）---"
          echo "--- M：★ .dat 路径（判据：应不再是 /sdcard//.dat）---"
          grep -a "\.dat" report/qemu_m/rundir_rebuild/stdout.txt 2>/dev/null | sort -u | head -5 || true
          echo "--- M：覆盖率（对比 J 的 76/223）+ 里程碑 ---"
          grep -aE "已执行" report/qemu_m/coverage_rebuild.txt 2>/dev/null || true
          grep -a "MX " report/qemu_m/milestones.txt 2>/dev/null || true
          python tools/exec_set_diff.py --factory report/qemu_j/coverage_rebuild.txt \
            --ours report/qemu_m/coverage_rebuild.txt --label j_vs_m \
            --out report/qemu_m/j_vs_m.txt || true
          sed -n "1,20p" report/qemu_m/j_vs_m.txt 2>/dev/null || true

      - name: 行为采集·场景 N（起始屏幕=5 mui_setting + 游戏目录 + ui.cfg ⇒ 打开 dir_serial_list；观测项）
        run: |
          cd 1to1
          # 依据：`dir_serial_list`（唯一的 readdir 填充者）**只被 `mui_setting` 调用**（callers=1），
          #   而 G/H/I/J/M 的起始屏幕都是 0（mui_menu）⇒ 目录扫描从未发生（strace 无 opendir/getdents）。
          #   本场景把起始屏幕换回 5（= E/F 的原始状态）+ 在 root_path(/sdcard) 下合成 NNN/ 游戏目录
          #   + 补 ui.cfg 闸门 ⇒ 三个必要条件同时满足，看 dir_serial_list / DisplayPage_list 是否被打开。
          export CGM_STAGE_EVIDENCE="report/qemu_n/stage_evidence.txt"
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 CGM_MENULOG_SCREEN=5 CGM_ROOTDAT=2 CGM_GAMEDIRS=2 CGM_UICFG=1 \
            CGM_IO_TRACE=1 CGM_COV_TAG=N \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_n || true
          echo "--- N：闸门值 + 游戏目录注入证据 ---"
          grep -a GAMEDIRS report/qemu_n/stage_evidence.txt 2>/dev/null | head -4 || true
          echo "--- N：★ 是否发生目录扫描（strace opendir/getdents）---"
          grep -acE "opendir|getdents" report/qemu_n/probe_stderr_rebuild_strace.txt 2>/dev/null | sed 's/^/   目录类系统调用次数: /'
          grep -aE "opendir|getdents" report/qemu_n/probe_stderr_rebuild_strace.txt 2>/dev/null | head -4 | sed "s/^/   /" || true
          echo "--- N：★ 是否打开 dir_serial_list / DisplayPage_list ---"
          grep -aE "已执行" report/qemu_n/coverage_rebuild.txt 2>/dev/null || true
          sed -n "1,22p" report/qemu_n/coverage_rebuild.txt 2>/dev/null | tail -14 || true

      - name: 行为采集·场景 O（ui.cfg 闸门 + 方向/确认键注入 ⇒ 菜单是否被驱动；观测项）
        run: |
          cd 1to1
          # 依据：场景 F/H 的注入没驱动菜单，可能是**列表为空**（闸门 0）导致菜单没有可选项可动。
          #   本场景在补上 ui.cfg 闸门的前提下注入 DOWN 按下/松开 + A 按下/松开（32 B 周期，
          #   与 joystick.zip/ui.cfg 的扫描码矩阵一致：1=DOWN 17=A），看是否出现屏幕切换。
          export CGM_STAGE_EVIDENCE="report/qemu_o/stage_evidence.txt"
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 CGM_UICFG=1 \
          CGM_INPUT_JS=0 CGM_INPUT_FILL=4096 \
          CGM_INPUT_HEX=0000000001000101000000000000010100000000010001110000000000000111 \
            CGM_IO_TRACE=1 CGM_COV_TAG=O \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_o || true
          echo "--- O：注入证据 + 闸门值 ---"
          grep -a "js-inject\|js 在线掩码" report/qemu_o/rundir_rebuild/stderr.txt 2>/dev/null | head -3 || true
          echo "--- O：覆盖率（对比 M）+ 是否出现屏幕切换 ---"
          grep -aE "已执行" report/qemu_o/coverage_rebuild.txt 2>/dev/null || true
          python tools/exec_set_diff.py --factory report/qemu_m/coverage_rebuild.txt \
            --ours report/qemu_o/coverage_rebuild.txt --label m_vs_o \
            --out report/qemu_o/m_vs_o.txt || true
          sed -n "1,20p" report/qemu_o/m_vs_o.txt 2>/dev/null || true

      - name: 行为采集·场景 P（合成 allfiles.lst 游戏索引 ⇒ 列表是否被填充；与 J 严格单变量）
        run: |
          cd 1to1
          # 外部依据（同族固件独立逆向 Wiki）："rkgame ... loads ... game lists from allfiles.lst"，
          #   且"菜单里看不到游戏"的官方解释 = allfiles.lst 与实际 ROM 不同步。
          #   格式逐字：Platform/filename.ext|Display Name|UPPERCASE NAME|Chinese Name|Abbreviated
          # 本机铁证：cores/filelist.xml 的 name="002/xxx.zip" ⇒ Platform 段取 NNN 数字目录。
          # 探针 ① 实测 DAT_003af394=11（>0）⇒ 列表循环应当执行；故本场景补上真正的索引文件，
          #   并用探针 ②（在 mui_DisplayThumbnail 内）读出被消费条目的 entry/basepath/basename。
          export CGM_STAGE_EVIDENCE="report/qemu_p/stage_evidence.txt"
          SYSROOT=/arm-root-device CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_LIBKMS_STUB=1 CGM_DRM_STUB=1 CGM_ALSA_STUB=1 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 CGM_ALLFILES=1 \
            CGM_IO_TRACE=1 CGM_COV_TAG=P \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_p || true
          echo "--- P：allfiles 注入证据 ---"
          grep -a ALLFILES report/qemu_p/stage_evidence.txt 2>/dev/null | head -3 || echo "   （无）"
          echo "--- P：★ allfiles.lst 是否被 open（strace）---"
          grep -a "allfiles" report/qemu_p/probe_stderr_rebuild_strace.txt 2>/dev/null | head -4 || echo "   （strace 里没有 allfiles）"
          echo "--- P：★ 探针 ①/② 实测值 ---"
          echo "--- P：★ .dat 路径（判据：是否不再是 /sdcard//.dat）+ 覆盖率 ---"
          grep -a "\.dat" report/qemu_p/rundir_rebuild/stdout.txt 2>/dev/null | sort -u | head -4 || true
          grep -aE "已执行" report/qemu_p/coverage_rebuild.txt 2>/dev/null || true
          python tools/exec_set_diff.py --factory report/qemu_j/coverage_rebuild.txt \
            --ours report/qemu_p/coverage_rebuild.txt --label j_vs_p \
            --out report/qemu_p/j_vs_p.txt || true
          sed -n "1,20p" report/qemu_p/j_vs_p.txt 2>/dev/null || true

      # ★★ 2026-09-20（GAP 16.43）：本步**必须放在所有场景之后**。
      #   历史坑：它原先排在场景 J/M/N/O/P **之前**，且场景清单**漏了 `qemu_c4`/`qemu_c5`**
      #   ⇒ 设备真机口径（C4/C5）与 J/M/N/O/P 的差集**从来没被产出过**。
      #   而这份"仅工厂执行 / 仅我们执行"正是**最便宜、最决定性**的刻度：
      #   C5 实测（手工补算）：**仅工厂执行只有 2 个**（run_process.constprop.0 80B / ClearBuffer 32B，
      #   均为内联/尾调用形态），而**仅我们执行 24 个**（mui_do_file_list/ReadUSBJoy/mui_outputxy_t…）
      #   ⇒ 分歧机制在"仅我们执行"那一侧（与本文件既有的场景 E 案例同源）。
      # ★★ 场景 D：判定「key2 的内容到底来自哪里」——这是 M6（UI 资源包打开 = 57% 重构量的入口）
      #   的唯一堵点。背景：崩溃现场实测 key2 = `00 00 00 00 00 7d 1e 47`
      #   （既不是我们注入的签名、也不是 shim 现有任何一种 KY 派生载荷；且全 .text 75 万条指令里
      #     **没有一条**直接构造 key2 的地址 ⇒ 写入者走 GOT 间接指针，静态两次漏判）。
      #   本场景把**所有 SFC 数据读**的载荷统一填成 0xC7（芯片ID/UniqueID 保持真实以免走错启动分支）：
      #     · key2 变成 C7 重复 ⇒ 链路 = SFC 读 → key2 ⇒ 沙箱修法 = 仿真正确的 security 载荷；
      #     · key2 不变        ⇒ 来源与 SFC 无关 ⇒ 下一步改用「key2 页写陷阱」抓写入者的 pc/lr。
      - name: 执行集合差集（比 stdout 前缀更早暴露分歧机制；观测项）
        if: always()
        run: |
          cd 1to1
          # 背景（2026-09-17 场景 E 实测）：行为门禁只比对 stdout 的**最长公共前缀**，
          #   于是"两侧都不打印、但走的代码路径不同"这类分歧它看不见。
          #   场景 E 前缀 18/18 PASS，而执行集合差集立刻露出：
          #     仅我们执行 = mui_outputxy_t(904B 字体渲染) / mui_DispBlock / get_item_from_line
          #                  / UnzipItem / strtrim{,l,r}
          #     仅工厂执行 = ClearBuffer
          #   机制：mui_InitFont 失败后工厂不再调用 mui_outputxy_t，我们照样调用
          #   ⇒ 无效字体传进去 ⇒ 崩在 stbtt_GetFontVMetricsOS2+0x8（ldrd 且 r0 无效）。
          # ★ 场景 A 的覆盖率报告名是 coverage_*.stdout.txt（B/C/E 是 coverage_*.txt）
          #   ⇒ 两种都要试，否则 A 静默不产出差集（实测踩坑）。
          for sc in qemu qemu_c qemu_c4 qemu_c5 qemu_j qemu_m qemu_n qemu_o qemu_p; do
            for f in report/$sc/coverage_factory.txt report/$sc/coverage_factory.stdout.txt; do
              [ -f "$f" ] || continue
              o="$(echo "$f" | sed s/_factory/_rebuild/)"
              [ -f "$o" ] || continue
              echo "=========== $sc ==========="
              python tools/exec_set_diff.py --factory "$f" --ours "$o" \
                --label "$sc" --out report/$sc/exec_set_diff.txt || true
              break
            done
          done

      # ★★ 2026-09-20（GAP 16.32）：**新增静态逐函数等价性门禁**。
      #   ★ 位置：放在**所有运行时观测场景之后**、artifact 上传之前 ——
      #     静态门禁若失败不应跳掉运行时观测（首跑实测：放在前面时后面 4 个场景全被 skipped）。
      #   为什么加：此前唯一的进度刻度是「QEMU 跑整体 + 函数级覆盖率」，它有两个硬伤 ——
      #     ① 只回答"能跑到哪"，不回答"写得对不对"（实测：修掉 1816 次忙循环，覆盖率一动不动）；
      #     ② 只覆盖 34%（76/223），**66% 的函数从未被任何判据检验过**；
      #     ③ 每轮推进要"重启容器 → bootstrap → 改 workflow → 等 CI"（8~12 分钟），且靠猜环境变量。
      #   本步改为**逐函数比对工厂与重建产物的机器码特征**：零 QEMU、几秒钟、覆盖 213/213。
      #   数据两侧都已在仓库里（`golden/factory.funcs.json` + 构建产物的 symtab）。
      #   判据：size_ratio（重建字节 / 工厂指令数×4），WARN>=1.6 FAIL>=2.5（沿用项目已验证阈值）；
      #         薄函数（工厂<=16B 空桩）与校准锚点（__libc_csu_*）由工具自动隔离，
      #         避免"工具链样板差异"被误判成"实现不符"（这是首跑实测出的失真，已被锚点抓住）。
      #   已知项由 `tools/prop_equiv_baseline.txt` 豁免（棘轮，修好必须删行）。
      - name: ★ 专有函数等价性差分（静态；零 QEMU；213/213 覆盖）
        run: |
          cd 1to1
          mkdir -p report
          echo '--- 判据自证（锚点必须全绿）---'
          python3 tools/prop_equiv.py --selftest
          echo '--- 逐函数差分 ---'
          python3 tools/prop_equiv.py --json report/prop_equiv.json
      # ★★ 2026-09-20（GAP 16.36）：**死循环门禁** —— 产物里出现「无出口循环」时，
      #   若源码没有 `for(;;)`/`while(1)`，就是"编译器把循环后续判为不可达而删除"。
      #   本轮实证：`init_user_joy_key_mask` 因循环边界取了另一个局部对象的地址
      #   （Ghidra 保真度陷阱）⇒ 108B 产物、整个 .o **只有 1 条重定位**，
      #   第二段循环与函数尾声被删光、第一段循环变成死循环。修复后 348B / 6 条重定位。
      # ★★ 2026-09-20（GAP 16.39）：**延时循环门禁** —— 源码里的「纯计数循环」
      #   （循环体只有 `X = X + 1;`）是 GPIO 位敲的时序延时；现代编译器会把它当
      #   死代码整体删掉（实测 clang 144B / GCC 14 88B，工厂 GCC 6.2 保留 384B）。
      #   判据与体积无关：看那个**上界常量**还在不在产物里（`0x27`=39）。
      - name: ★ 延时循环门禁（源码的纯计数循环其常量必须在产物中）
        run: |
          set -e
          cd 1to1
          python3 tools/scan_delay_loops.py
      - name: ★ 死循环门禁（产物出现无出口循环且源码无 for(;;) ⇒ 函数体被删）
        run: |
          set -e
          cd 1to1
          python3 tools/scan_dead_loop.py --selftest
          python3 tools/scan_dead_loop.py
      - name: 上传行为指纹与原始输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1to1-qemu-behav
          path: |
             1to1/report/qemu/
             1to1/report/qemu_c/
             # ★ 2026-09-19 补：C4/C5 是"设备真机口径"的判决性场景，产物必须留档
             #   （此前漏登记 ⇒ 首跑跑完了却拿不到 rundir/stdout，只能靠 CI 日志里 echo 出来的摘要）
             1to1/report/qemu_c4/
             1to1/report/prop_equiv.json
             1to1/report/qemu_c5/
