name: 1to1-qemu-behav

# ============================================================
# P5 行为差分门禁（独立 workflow）
#
# 为什么不并入 1to1-verify：
#   · 1to1-verify 是「静态门禁」（编译 / 链接 / 布局 / ABI），状态应当是稳定可绿的；
#   · 本 workflow 是「动态门禁」，需要 qemu + armhf sysroot + 运行期驱动，
#     在把被测程序真正驱动起来之前它会**持续红**。
#   把两者分开，才能保证「绿」始终等于「真的绿」——而不是靠 continue-on-error 掩盖。
#   ★ 本 workflow 内**没有任何 continue-on-error**；INCONCLUSIVE(3) 同样判失败。
#
# 环境选型依据（见 tools/ci_qemu_env.sh 顶部注释）：
#   sysroot 必须是 Ubuntu 22.04 armhf —— 与 CI 工具链同版本 glibc(2.35)，
#   否则重建产物会 `version GLIBC_2.35 not found`。工厂 rkgame 只要 ≥2.7，向下兼容。
# ============================================================

on:
  workflow_dispatch:
  push:
    paths:
      - '1to1/**'
      - '.github/workflows/1to1-qemu-behav.yml'

permissions:
  contents: read

jobs:
  qemu-behav:
    name: P5 qemu 行为差分（factory vs rebuild）
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ARM 交叉工具链
        run: |
          sudo apt-get update -qq
          # gdb-multiarch：用于回溯探针（取真实崩溃点与调用栈）
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf strace gdb-multiarch
          arm-linux-gnueabihf-gcc --version | head -1

      - name: 安装 zig（与本地同一工具链 ⇒ 重建产物的 GLIBC 下限可控）
        run: |
          python3 -m pip install --quiet --disable-pip-version-check ziglang==0.16.0
          ZIG="$(python3 -c 'import ziglang,os;print(os.path.join(os.path.dirname(ziglang.__file__),"zig"))')"
          chmod +x "$ZIG"
          echo "ZIG=$ZIG" >> "$GITHUB_ENV"
          echo "CC=$ZIG cc" >> "$GITHUB_ENV"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zigcache" >> "$GITHUB_ENV"
          "$ZIG" version

      - name: 建立 qemu-user + armhf sysroot
        run: sudo -E sh 1to1/tools/ci_qemu_env.sh /arm-root

      - name: 准备真机同款工作目录 /sdcard/cubegm
        run: |
          sudo mkdir -p /sdcard/cubegm/saves /sdcard/cubegm/states
          sudo chown -R "$USER" /sdcard
          ls -la /sdcard/cubegm

      - name: 构建 1:1 重建产物（含 build/obj 对象）
        run: |
          cd 1to1
          mkdir -p report
          # link_audit.sh 是本仓库里唯一会把 src/proprietary/*.c 编译成 build/obj/*.o 的脚本；
          # 它自身的门禁结论由 1to1-verify 负责，这里只为拿对象，故 rc 不强判。
          PY=python3 sh tools/link_audit.sh report/link_audit.txt || \
            echo "[warn] link_audit 非零（对象已产出，继续）: rc=$?"
          PY=python3 sh tools/build_upstream.sh build/upstream
          PY=python3 sh tools/link_full.sh build/rkgame.rebuilt.elf
          echo '--- 动态段 / 初始化链自洽门禁（跑起来之前先静态拦一遍）---'
          python3 tools/dyn_audit.py build/rkgame.rebuilt.elf
          echo '--- 被测二进制 ---'
          ls -la build/rkgame.rebuilt.elf golden/factory.rkgame.bin

      - name: 行为采集 + 差分 ★ 硬门禁
        run: |
          cd 1to1
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=20 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu

      # ★★ 场景 B：注入厂商 ZIP 签名表（key2@0x3E190C）⇒ 资源包**可打开** ⇒ 首次进入菜单正文。
      #   为什么必须有它：场景 A 里两侧都停在 `open .../ui_cn.zip fail` ⇒ `mui_setting` NULL+4 崩，
      #   于是 mui 模块（42 函数 / 70,396 B = 重构量的 57%）**永远跑不到**，覆盖率天花板 25%。
      #   ★ 本步骤是**观测（非门禁）**：场景 B 尚在建立基线期（首跑可能仍两侧同崩或立刻暴露新分歧），
      #     故用 `|| true` 只为拿数据。**基线稳定后必须去掉 `|| true` 升级为硬门禁**（否则等于白测）。
      - name: 行为采集·场景 B（注入 key2，观测非门禁，待升级）
        continue-on-error: true
        run: |
          cd 1to1
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=25 CGM_KEY2_SEED=1 CGM_COV_TAG=B \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_b || true
          echo '--- 场景 B 覆盖率（对比场景 A 的天花板）---'
          for f in report/qemu_b/coverage_rebuild.txt report/qemu_b/coverage_factory.txt; do
            [ -f "$f" ] && { echo "== $f =="; sed -n '1,9p' "$f"; }
          done

      # ★★ 场景 C：补一个**空** `libkms.so.1` 桩 ⇒ `driver.so` 真正加载 ⇒ 硬件接口层首次进入观测窗口。
      #   依据：`driver.so` 的未定义符号里**没有任何 `kms_*`**（只有 libc + libdrm + libasound）
      #   ⇒ `libkms.so.1` 是历史遗留 DT_NEEDED，一个空 .so 即可满足加载器。
      #   ★ 两侧注入同一份桩 ⇒ 差分公平；桩只进 LD_LIBRARY_PATH，场景 A/B 不受影响。
      #   ★ 同样是**观测（非门禁）**：driver.so 真跑起来后可能立刻暴露新分歧/新崩溃（那正是我们要的信息）。
      - name: 行为采集·场景 C（补 libkms 桩解锁 driver.so，观测非门禁）
        continue-on-error: true
        run: |
          cd 1to1
          mkdir -p report/stublib
          sh tools/build_libkms_stub.sh report/stublib || echo "[warn] 桩构建失败，场景 C 退化为场景 A"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=25 CGM_COV_TAG=C CGM_LIBKMS_STUB=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_c || true
          echo '--- 场景 C：driver.so 是否已加载（stdout 不应再出现 libkms 报错）---'
          grep -a "driver.so" report/qemu_c/rundir_factory/stdout.txt \
                            report/qemu_c/rundir_rebuild/stdout.txt \
            || echo "(两侧均无 driver.so 报错行 ⇒ 已成功加载)"
          echo '--- 场景 C 覆盖率 ---'
          sed -n '1,9p' report/qemu_c/coverage_rebuild.txt 2>/dev/null || true

      # ★★ 场景 D：判定「key2 的内容到底来自哪里」——这是 M6（UI 资源包打开 = 57% 重构量的入口）
      #   的唯一堵点。背景：崩溃现场实测 key2 = `00 00 00 00 00 7d 1e 47`
      #   （既不是我们注入的签名、也不是 shim 现有任何一种 KY 派生载荷；且全 .text 75 万条指令里
      #     **没有一条**直接构造 key2 的地址 ⇒ 写入者走 GOT 间接指针，静态两次漏判）。
      #   本场景把**所有 SFC 数据读**的载荷统一填成 0xC7（芯片ID/UniqueID 保持真实以免走错启动分支）：
      #     · key2 变成 C7 重复 ⇒ 链路 = SFC 读 → key2 ⇒ 沙箱修法 = 仿真正确的 security 载荷；
      #     · key2 不变        ⇒ 来源与 SFC 无关 ⇒ 下一步改用「key2 页写陷阱」抓写入者的 pc/lr。
      - name: 行为采集·场景 E（.zip 打开瞬间重新断言 key2 ⇒ 单变量定位写入者，观测非门禁）
        run: |
          # 关键地址普查（工厂侧 unzLocateFile 的三个关键分支 + zip 遍历；重建侧为 0 属正常）
          cd 1to1
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=25 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=E           CGM_TRACE_ADDRS="000119f4 000119e4 0001162c 00010ea0 000115ec 00011948 00011950" CGM_DBGUNZ=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_e || true
          echo '--- 场景 E：shim 看到的 I/O 轨迹（自证探针可达；◀ ZIP 标出 zip 打开）---'
          grep -a "shim] io " report/qemu_e/rundir_factory/stderr.txt | head -30 || true
          echo '--- 场景 E：key2 重新断言的证据行 ---'
          grep -a "key2 re-assert" report/qemu_e/rundir_factory/stderr.txt | head -6 || true
          echo '--- 场景 E：zip 打开失败行数（与场景 A/B 对比；0 = 窗口打开）---'
          for d in qemu qemu_b qemu_e; do
            n=$(grep -ac "ui_cn.zip fail" report/$d/rundir_factory/stdout.txt 2>/dev/null || echo '?')
            echo "   $d : $n 行"
          done
          echo '--- 场景 E：两侧崩溃现场（★ 无此行=崩在报告器装配之前，属仪器缺陷）---'
          for l in factory rebuild; do
            echo "   [$l]"
            grep -a "★ 真崩溃\|pc(出错点)\|lr(调用者)\|^\[shim\]     \[sp" \
              report/qemu_e/rundir_$l/stderr.txt | head -8 | sed 's/^/     /' || true
          done
          echo '--- 场景 E：★ 运行期证据 —— UnzipItem 后缓冲区是否真的被写入 ---'
          grep -a 'DBGUNZ' report/qemu_e/rundir_rebuild/stdout.txt | head -12 || echo '   （无 DBGUNZ 行）'
          echo '--- 场景 E：里程碑 + 覆盖率 ---'
          sed -n '1,14p' report/qemu_e/milestones.txt 2>/dev/null || true
          sed -n '1,9p' report/qemu_e/coverage_rebuild.txt 2>/dev/null || true

      - name: 执行集合差集（比 stdout 前缀更早暴露分歧机制；观测项）
        if: always()
        run: |
          cd 1to1
          # 背景（2026-09-17 场景 E 实测）：行为门禁只比对 stdout 的**最长公共前缀**，
          #   于是"两侧都不打印、但走的代码路径不同"这类分歧它看不见。
          #   场景 E 前缀 18/18 PASS，而执行集合差集立刻露出：
          #     仅我们执行 = mui_outputxy_t(904B 字体渲染) / mui_DispBlock / get_item_from_line
          #                  / UnzipItem / strtrim{,l,r}
          #     仅工厂执行 = ClearBuffer
          #   机制：mui_InitFont 失败后工厂不再调用 mui_outputxy_t，我们照样调用
          #   ⇒ 无效字体传进去 ⇒ 崩在 stbtt_GetFontVMetricsOS2+0x8（ldrd 且 r0 无效）。
          # ★ 场景 A 的覆盖率报告名是 coverage_*.stdout.txt（B/C/E 是 coverage_*.txt）
          #   ⇒ 两种都要试，否则 A 静默不产出差集（实测踩坑）。
          for sc in qemu qemu_b qemu_c qemu_e qemu_f qemu_g qemu_h qemu_i qemu_j qemu_k; do
            for f in report/$sc/coverage_factory.txt report/$sc/coverage_factory.stdout.txt; do
              [ -f "$f" ] || continue
              o="$(echo "$f" | sed s/_factory/_rebuild/)"
              [ -f "$o" ] || continue
              echo "=========== $sc ==========="
              python tools/exec_set_diff.py --factory "$f" --ours "$o" \
                --label "$sc" --out report/$sc/exec_set_diff.txt || true
              break
            done
          done

      - name: 行为采集·场景 F（输入事件注入 ⇒ 驱动菜单交互路径，观测非门禁）
        run: |
          cd 1to1
          # 背景（第 48 轮）：`/dev/input/*` 被 shim 重定向到 /dev/zero ⇒ `ReadUSBJoy` 的
          #   `read(fd,buf,8)` 读回 8 个零字节 ⇒ type=0（既非 BUTTON(1) 也非 INIT(2)）
          #   ⇒ 直接 return 旧值 ⇒ 菜单永远收不到输入：场景 E 虽已"活着"（M7 达成），
          #   但停在 js0 Opened!；`mui` 模块（42 函数 / 70396 B = 重构量 57%）零覆盖。
          # 本场景由 shim 把 `/dev/input/jsN` 变成内存事件源（memfd + 预置 js_event）；
          #   两侧共用同一 shim 与同一注入脚本 ⇒ 差分公平。
          # 事件（8 字节 struct js_event，小端：[time u32][value i16][type u8][number u8]）：
          #   一个周期 = `0000000001000100`（按下 button 0）+ `0000000000000100`（松开）；
          #   `CGM_INPUT_FILL=4096` 把它**循环填充到 4 KiB** ⇒ 256 个周期 ⇒ 约 7.7 秒按键活动
          #   （`ReadUSBJoy` 每 15ms 读一次）⇒ 覆盖菜单初始化之后的窗口，
          #   而不再是"启动瞬间注入一次就 EOF"。同时 `CGM_INPUT_JS=0` 只让 js0 在线
          #   （真机只插一个手柄；第一版让 4 个 js 全在线，是不符真机的假象）。
          #   `ReadJoystick` 的 Delay 连发逻辑（0x27 次阈值）周期性产生按键 ⇒ 覆盖整个运行窗口。
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_IO_TRACE=1 CGM_COV_TAG=F \
          CGM_INPUT_JS=0 CGM_INPUT_FILL=4096 CGM_DBGUNZ=1 \
          CGM_INPUT_HEX=00000000010001000000000000000100 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_f || true
          echo "--- 场景 F：注入启用证据（两侧应各有一行）---"
          for l in factory rebuild; do
            echo "   [$l]"
            grep -a "js 输入注入已启用" report/qemu_f/rundir_$l/stderr.txt | head -2 || true
            grep -a "js-inject" report/qemu_f/rundir_$l/stderr.txt | head -4 || true
          done
          echo "--- 场景 F：里程碑（对比 E 场景是否新增动作）---"
          sed -n "/ID     里程碑/,/M7/p" report/qemu_f/milestones.txt 2>/dev/null || true
          echo "--- 场景 F：stdout 行数 + 专有函数覆盖率 ---"
          wc -l report/qemu_f/rundir_factory/stdout.txt report/qemu_f/rundir_rebuild/stdout.txt 2>/dev/null || true
          sed -n "1,9p" report/qemu_f/coverage_rebuild.txt 2>/dev/null || true

      - name: 行为采集·场景 G（起始屏幕注入 ⇒ 打开 mui_menu 分支；与 E 严格单变量）
        run: |
          cd 1to1
          # 背景（第 49 轮）：main_Menu 的屏幕分派 = switch(menulog[0])，
          #   0=mui_menu 1=mui_type 2=mui_recent 3=mui_shoucang 4=mui_search 5=mui_setting。
          #   原厂 menu.log 头 4 字节 = 05 ⇒ 开机即停在「设置页」的 while(true) 循环里。
          #   这解释了场景 E/F「活着(exit=124)但覆盖率恒为 68/223」：
          #   mui_setting 已覆盖 ✓，而 mui_menu/mui_search/mui_recent/mui_type/mui_shoucang
          #   五个屏幕函数（合计 26 KB）永远走不到。
          # 本场景只改写 menu.log 头 4 字节（其余 440 B 原厂原样）+ 与 E 完全相同的探针集
          #   ⇒ E vs G 可直接归因到「起始屏幕」这一个变量。
          export CGM_STAGE_EVIDENCE="report/qemu_g/stage_evidence.txt"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=25 CGM_MENULOG_SCREEN=0 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=G \
          CGM_TRACE_ADDRS="000119f4 000119e4 0001162c 00010ea0 000115ec 00011948 00011950" CGM_DBGUNZ=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_g || true
          echo "--- 场景 G：menu.log 注入证据（应出现 6 次 = 3 侧 x 探针+采集）---"
          cat report/qemu_g/stage_evidence.txt 2>/dev/null || echo "   （无证据文件 ⇒ 注入未生效，须查）"
          echo "--- 场景 G：里程碑（对比 E：M7 之后是否新增动作）---"
          sed -n "/ID     里程碑/,/M7/p" report/qemu_g/milestones.txt 2>/dev/null || true
          echo "--- 场景 G：覆盖率 + 下一轮目标清单 ---"
          sed -n "1,12p" report/qemu_g/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 G：执行集合差集（工厂 vs 我们）---"
          python tools/exec_set_diff.py --factory report/qemu_g/coverage_factory.txt \
            --ours report/qemu_g/coverage_rebuild.txt --label qemu_g \
            --out report/qemu_g/exec_set_diff.txt || true
          sed -n "1,20p" report/qemu_g/exec_set_diff.txt 2>/dev/null || true

      - name: 行为采集·场景 H（mui_menu + 方向/确认键注入；与 G 严格单变量）
        run: |
          cd 1to1
          # 背景（第 49 轮）：场景 F 注入的是 button 0 = SELECT（见 joystick.zip/ui.cfg 的
          #   扫描码矩阵：0=SELECT 1=DOWN 2=UP 4=LEFT 8=START 16=RIGHT 17=A 18=B），
          #   而 SELECT 几乎不改变菜单状态 ⇒ 输入确被读到（strace: read(js0)=8）
          #   却没被翻译成菜单动作。
          # 本场景在「起始屏幕 = mui_menu」的前提下注入**方向键 + 确认键**：
          #   32 字节周期 = DOWN 按下 / DOWN 松开 / A 按下 / A 松开
          #   （js_event 小端：[time u32][value i16][type u8][number u8]）；
          #   CGM_INPUT_FILL=4096 ⇒ 128 周期 = 512 事件（约 7.7 s 按键活动）。
          # 与 G 的唯一差别 = 输入注入 ⇒ G vs H 可归因到「输入」这一个变量。
          export CGM_STAGE_EVIDENCE="report/qemu_h/stage_evidence.txt"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_MENULOG_SCREEN=0 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=H CGM_DBGUNZ=1 \
          CGM_INPUT_JS=0 CGM_INPUT_FILL=4096 \
          CGM_INPUT_HEX=0000000001000101000000000000010100000000010001110000000000000111 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_h || true
          echo "--- 场景 H：注入证据（menu.log + js）---"
          cat report/qemu_h/stage_evidence.txt 2>/dev/null || true
          grep -a "js-inject\|js 在线掩码\|js 事件流填充" report/qemu_h/rundir_rebuild/stderr.txt 2>/dev/null | head -4 || true
          echo "--- 场景 H：里程碑 ---"
          sed -n "/ID     里程碑/,/M7/p" report/qemu_h/milestones.txt 2>/dev/null || true
          echo "--- 场景 H：覆盖率（对比 G）---"
          sed -n "1,12p" report/qemu_h/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 G vs H：新增执行的专有函数 ---"
          python tools/exec_set_diff.py --factory report/qemu_g/coverage_rebuild.txt \
            --ours report/qemu_h/coverage_rebuild.txt --label g_vs_h \
            --out report/qemu_h/g_vs_h.txt || true
          sed -n "1,20p" report/qemu_h/g_vs_h.txt 2>/dev/null || true

      - name: 行为采集·场景 I（补 /sdcard/root.dat（ZIP/fileinfo.txt）⇒ 解 mui_do_file_list 的 NULL 崩溃；与 G 严格单变量）
        run: |
          cd 1to1
          # 背景（第 49 轮）：场景 G 首次打开 mui_menu + mui_do_file_list，但仍 exit=139。
          #   崩溃现场：fopen(/sdcard/root.dat)=-1 后 pc=mui_do_file_list+0xf0 的 ldrb r0,[r0]，r0=0。
          #   工厂反编译 00_rkgame_ALL.c:19285 = mui_do_file_list(iVar11, DAT_003af2ac)，
          #   而 DAT_003af2ac 在 root.dat 失败分支保持 NULL（两侧逐行同构）
          #   ⇒ 这是**环境缺口**（沙箱缺 /sdcard/root.dat），不是实现缺陷。
          # 本场景由 stage_sdcard_env.sh 合成该 ZIP（内容 = golden/sdcard_min/fileinfo 49 B），
          #   其余与场景 G 完全一致 ⇒ G vs I 可归因到「root.dat 有无」这一个变量。
          export CGM_STAGE_EVIDENCE="report/qemu_i/stage_evidence.txt"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=1 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=I CGM_DBGUNZ=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_i || true
          echo "--- 场景 I：menu.log + root.dat 注入证据（各应 6 次）---"
          cat report/qemu_i/stage_evidence.txt 2>/dev/null || echo "   （无证据文件 ⇒ 注入未生效，须查）"
          echo "--- 场景 I：里程碑 / 覆盖率（对比 G）---"
          sed -n "/ID     里程碑/,/M7/p" report/qemu_i/milestones.txt 2>/dev/null || true
          sed -n "1,12p" report/qemu_i/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 I：崩溃现场（两侧）---"
          for l in factory rebuild; do
            echo "   [$l]"
            grep -a "真崩溃\|故障指令\|pc(出错点)\|crash_fault" report/qemu_i/rundir_$l/stderr.txt report/qemu_i/behav_$l.json 2>/dev/null | head -6 || true
          done
          echo "--- 场景 I vs G：新增执行的专有函数 ---"
          python tools/exec_set_diff.py --factory report/qemu_g/coverage_rebuild.txt \
            --ours report/qemu_i/coverage_rebuild.txt --label g_vs_i \
            --out report/qemu_i/g_vs_i.txt || true
          sed -n "1,24p" report/qemu_i/g_vs_i.txt 2>/dev/null || true

      - name: 行为采集·场景 J（root.dat 的 fileinfo.txt 换真值源 = filelist.xml；与 I 严格单变量）
        run: |
          cd 1to1
          # 背景（第 49 轮）：场景 I 补了 root.dat 后覆盖 59→76（首次超过 68）且 M7 复现，
          #   但出现 `open /sdcard//.dat fail` 反复刷屏 ⇒ fileinfo.txt 的内容不对。
          #   真值源（mui_do_file_list 的解析循环）：分隔符 = " , ; 换行 回车 "，
          #   每项经 mui_extract_basepath 后**被 strtol(...,10) 当十进制数**
          #   ⇒ 每项必须是 NNN/文件名 形态；场景 I 用的 golden/fileinfo 是单个 0，
          #   没有斜杠 ⇒ basepath 为空 ⇒ /sdcard//.dat。
          #   而 cores/filelist.xml 的 name="002/xxx.zip" 正是该形态 ⇒ 用它当 fileinfo.txt。
          # 本场景只改 fileinfo.txt 的来源（CGM_ROOTDAT 1→2），其余与 I 完全一致。
          export CGM_STAGE_EVIDENCE="report/qemu_j/stage_evidence.txt"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=J CGM_DBGUNZ=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_j || true
          echo "--- 场景 J：root.dat 注入证据（应含 mode=filelist）---"
          grep -a ROOTDAT report/qemu_j/stage_evidence.txt 2>/dev/null | head -8 || echo "   （无）"
          echo "--- 场景 J：/sdcard//.dat 失败行数（对比 I，期望显著下降）---"
          for d in qemu_i qemu_j; do
            printf "   %s : %s 行\n" "$d" "$(grep -ac "/.dat fail" report/$d/rundir_rebuild/stdout.txt 2>/dev/null)"
          done
          echo "--- 场景 J：里程碑 / 覆盖率（对比 I）---"
          sed -n "/ID     里程碑/,/MX/p" report/qemu_j/milestones.txt 2>/dev/null || true
          grep -aE "已执行|覆盖函数|覆盖字节" report/qemu_j/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 J vs I：新增执行的专有函数 ---"
          python tools/exec_set_diff.py --factory report/qemu_i/coverage_rebuild.txt \
            --ours report/qemu_j/coverage_rebuild.txt --label i_vs_j \
            --out report/qemu_j/i_vs_j.txt || true
          sed -n "1,26p" report/qemu_j/i_vs_j.txt 2>/dev/null || true
      - name: 行为采集·场景 K（合成 NNN/ 游戏目录 + 占位游戏文件；与 J 严格单变量）
        run: |
          cd 1to1
          # 背景（第 49 轮）：场景 J 否证了 root.dat 的**内容**有影响；真因是 file_info_list
          #   的另一条填充路径 dir_serial_list（readdir 扫目录，拷 d_name + 记 d_type）。
          #   沙箱 /sdcard/cubegm 顶层只有 cores/，没有 000/002/004 三个游戏目录
          #   ⇒ 列表为空 ⇒ mui_extract_basepath 取不到斜杠 ⇒ 空 basepath ⇒ /sdcard//.dat。
          # 本场景按 cores/filelist.xml 的 135 个 name= 合成这 3 个目录 + 占位游戏文件
          #   （只造名字，占位文件 = 22 B 空 ZIP）。其余与 J 完全一致 ⇒ J vs K 严格单变量。
          export CGM_STAGE_EVIDENCE="report/qemu_k/stage_evidence.txt"
          SYSROOT=/arm-root CGM_WORK=/sdcard/cubegm CGM_TIMEOUT=30 CGM_MENULOG_SCREEN=0 CGM_ROOTDAT=2 CGM_GAMEDIRS=1 \
          CGM_KEY2_SEED=1 CGM_KEY2_HOOK=1 CGM_KEY2_PROBE=1 CGM_IO_TRACE=1 CGM_COV_TAG=K CGM_DBGUNZ=1 \
            sh tools/ci_qemu_behav.sh \
              build/rkgame.rebuilt.elf golden/factory.rkgame.bin report/qemu_k || true
          echo "--- 场景 K：游戏目录注入证据 ---"
          grep -a GAMEDIRS report/qemu_k/stage_evidence.txt 2>/dev/null | head -8 || echo "   （无）"
          echo "--- 场景 K：★ .dat 失败行的**内容**（关键：/sdcard//.dat 应变成 /sdcard/NNN/NNN.dat）---"
          for d in qemu_j qemu_k; do
            echo "   [$d] 去重后的 .dat 路径："
            grep -a "/.dat fail" report/$d/rundir_rebuild/stdout.txt 2>/dev/null | sort -u | head -6 | sed "s/^/      /" || true
          done
          echo "--- 场景 K：里程碑 / 覆盖率（对比 J）---"
          sed -n "/ID     里程碑/,/MX/p" report/qemu_k/milestones.txt 2>/dev/null || true
          grep -aE "已执行|覆盖函数|覆盖字节" report/qemu_k/coverage_rebuild.txt 2>/dev/null || true
          echo "--- 场景 K vs J：新增执行的专有函数 ---"
          python tools/exec_set_diff.py --factory report/qemu_j/coverage_rebuild.txt \
            --ours report/qemu_k/coverage_rebuild.txt --label j_vs_k \
            --out report/qemu_k/j_vs_k.txt || true
          sed -n "1,28p" report/qemu_k/j_vs_k.txt 2>/dev/null || true
      - name: 上传行为指纹与原始输出
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 1to1-qemu-behav
          path: |
            1to1/report/qemu/
            1to1/report/qemu_b/
            1to1/report/qemu_c/
            1to1/report/qemu_e/
            1to1/report/qemu_f/
            1to1/report/qemu_g/
            1to1/report/qemu_h/
            1to1/report/qemu_i/
            1to1/report/qemu_j/
            1to1/report/qemu_k/
          if-no-files-found: warn
